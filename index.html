<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F3F4F1">
<title>Daily Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--fd:'Bricolage Grotesque',system-ui,sans-serif;--fb:'Schibsted Grotesk',system-ui,sans-serif;--maxw:560px;--danger:#EF4444;--success:#10B981}
body[data-amb="galet"]{--paper:#F3F4F1;--ink:#16211C;--ink2:#5C6B63;--ink3:#94A29B;--hair:rgba(22,33,28,.1);--chip:rgba(22,33,28,.055);--field:#FFFFFF}
body[data-amb="ivoire"]{--paper:#F8F6F0;--ink:#211D16;--ink2:#6B6355;--ink3:#A29A8C;--hair:rgba(33,29,22,.1);--chip:rgba(33,29,22,.055);--field:#FFFFFF}
body[data-amb="brume"]{--paper:#EFF2F5;--ink:#161D24;--ink2:#5A6774;--ink3:#93A0AC;--hair:rgba(22,29,36,.1);--chip:rgba(22,29,36,.055);--field:#FFFFFF}
body[data-amb="sauge"]{--paper:#ECF2EC;--ink:#152018;--ink2:#57685C;--ink3:#8FA095;--hair:rgba(21,32,24,.1);--chip:rgba(21,32,24,.055);--field:#FBFDFB}
body[data-amb="ciel"]{--paper:#EDF3F8;--ink:#131E28;--ink2:#54697A;--ink3:#8CA1B1;--hair:rgba(19,30,40,.1);--chip:rgba(19,30,40,.055);--field:#FBFDFF}
body[data-amb="rosee"]{--paper:#F7EFF1;--ink:#241619;--ink2:#75585E;--ink3:#AC9097;--hair:rgba(36,22,25,.1);--chip:rgba(36,22,25,.055);--field:#FFFCFD}
body[data-amb="sable"]{--paper:#F5F0E7;--ink:#221C10;--ink2:#6F6450;--ink3:#A69A82;--hair:rgba(34,28,16,.1);--chip:rgba(34,28,16,.055);--field:#FFFDF8}
body[data-amb="lavande"]{--paper:#F1EFF7;--ink:#191624;--ink2:#605A75;--ink3:#9791AC;--hair:rgba(25,22,36,.1);--chip:rgba(25,22,36,.055);--field:#FCFBFF}
body[data-amb="encre"]{--paper:#151A18;--ink:#F0F3F1;--ink2:#9BA8A1;--ink3:#5E6A64;--hair:rgba(240,243,241,.12);--chip:rgba(240,243,241,.08);--field:#1E2422}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent}
body{font-family:var(--fb);color:var(--ink);background:var(--paper);min-height:100vh;-webkit-font-smoothing:antialiased;overscroll-behavior:none;transition:background .7s ease,color .7s ease}
#wrap{max-width:var(--maxw);margin:0 auto;padding:26px 20px 140px}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.rise{animation:rise .55s cubic-bezier(.2,.9,.3,1) both}

#LS{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#F3F4F1;transition:opacity .3s}
#LS.h{opacity:0;pointer-events:none}
#LS .sp{width:30px;height:30px;border:3px solid rgba(22,33,28,.15);border-top-color:#16211C;border-radius:50%;animation:spin .7s linear infinite}
#LS p{margin-top:12px;font-family:var(--fd);font-weight:800;font-size:11px;letter-spacing:3px;color:#94A29B}
#app{display:none}

/* Header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{font-family:var(--fd);font-weight:800;font-size:38px;letter-spacing:-.5px;word-spacing:.06em;line-height:1.02}
h1 small{display:block;font-size:15px;font-weight:500;font-family:var(--fb);color:var(--ink2);letter-spacing:0;word-spacing:.05em;margin-top:6px}
.top-btns{display:flex;gap:8px;flex-shrink:0;margin-top:4px}
.round-btn{width:40px;height:40px;border-radius:50%;border:none;background:var(--chip);color:var(--ink2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.round-btn:hover{transform:scale(1.08)}
.round-btn svg{width:17px;height:17px}
#ambDot{border:2px solid var(--hair)}
.syncd{position:absolute;width:8px;height:8px;border-radius:50%;transition:background .3s;margin:-2px 0 0 30px}
.syncd.on{background:var(--success)}.syncd.off{background:#F59E0B}

.ambs{display:flex;gap:8px;justify-content:flex-end;max-height:0;overflow:hidden;opacity:0;transition:max-height .4s cubic-bezier(.2,.9,.3,1),opacity .3s,margin .4s;margin:0}
.ambs.open{max-height:50px;opacity:1;margin:14px 0 2px}
.ambs button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .2s;padding:0;flex-shrink:0}
.ambs button.on{border-color:var(--ink);transform:scale(1.12)}

.progress{margin:20px 0 4px}
.progress-track{height:3px;border-radius:99px;background:var(--hair);overflow:hidden}
.progress-fill{height:100%;border-radius:99px;width:0%;transition:width .8s cubic-bezier(.2,.9,.3,1),background .4s}

/* Onglets soulignés */
.tabs{display:flex;gap:22px;overflow-x:auto;padding:18px 2px 0;scrollbar-width:none;align-items:baseline}
.tabs::-webkit-scrollbar{display:none}
.tab{border:none;background:0;font-family:var(--fd);font-weight:700;font-size:19px;letter-spacing:0;word-spacing:.05em;color:var(--ink3);cursor:pointer;padding:6px 0 10px;position:relative;white-space:nowrap;user-select:none;-webkit-user-select:none;transition:color .25s}
.tab.on{color:var(--tabc,var(--ink))}
.tab.on::after{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:99px;background:var(--tabc,var(--ink))}
.tab.trash-tab{font-size:16px;font-weight:600;margin-left:auto}
.tab-add{border:none;background:0;color:var(--ink3);font-size:21px;font-weight:500;cursor:pointer;padding:0 2px 8px;transition:color .2s}
.tab-add:hover{color:var(--ink2)}

/* Vider la corbeille */
.empty-trash{display:flex;align-items:center;gap:8px;margin:16px 0 4px;padding:12px 16px;border-radius:16px;border:1.5px solid rgba(239,68,68,.3);background:transparent;color:var(--danger);font-family:var(--fb);font-weight:700;font-size:14px;word-spacing:.05em;cursor:pointer;transition:background .2s}
.empty-trash:hover{background:rgba(239,68,68,.08)}
.empty-trash svg{width:16px;height:16px}

/* Rangées */
.list{margin-top:14px}
.row{padding:17px 2px;border-bottom:1px solid var(--hair);cursor:pointer;transition:background .25s;border-radius:14px}
.row:active{background:var(--chip)}
.row.drg{opacity:.5;background:var(--chip)}
.row-head{display:flex;align-items:flex-start;gap:14px}
.chk{flex-shrink:0;width:34px;height:34px;border-radius:50%;border:2.5px solid var(--ink3);background:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;padding:0}
.chk:hover{border-color:var(--ink);transform:scale(1.08)}
.chk.done{background:var(--ink);border-color:var(--ink)}
.chk.pop{animation:pop .4s cubic-bezier(.2,.9,.3,1)}
.chk svg{width:16px;height:16px;color:var(--paper)}
.tcon{flex:1;min-width:0;padding-top:4px}
.ttitle{font-family:var(--fd);font-weight:700;font-size:21px;letter-spacing:-.1px;word-spacing:.08em;line-height:1.25;word-break:break-word;overflow-wrap:anywhere}
.tdetails{font-size:15.5px;font-weight:500;color:var(--ink2);line-height:1.55;word-spacing:.05em;margin-top:6px;white-space:pre-wrap;word-break:break-word}
.tedit{width:100%;background:0;border:none;border-bottom:2px solid var(--ink2);font-size:17px;font-weight:500;font-family:var(--fb);word-spacing:.05em;padding:2px 0;color:var(--ink);outline:0;resize:none;overflow:hidden;line-height:1.5}

/* Actions au tap */
.acts{display:flex;gap:8px;max-height:0;overflow:hidden;opacity:0;transition:max-height .35s cubic-bezier(.2,.9,.3,1),opacity .25s,margin .35s;margin:0;padding-left:48px;flex-wrap:wrap}
.row.open .acts{max-height:64px;opacity:1;margin-top:14px}
.acts button{width:42px;height:42px;border-radius:50%;border:none;background:var(--chip);color:var(--ink2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s,background .2s;flex-shrink:0}
.acts button:hover{transform:scale(1.1)}
.acts button.del:hover{background:var(--danger);color:#fff}
.acts button.rest:hover{background:var(--success);color:#fff}
.acts svg{width:18px;height:18px}
.acts .grip{cursor:grab;touch-action:none}
.acts .grip:active{cursor:grabbing}
@media(max-width:420px){.acts{padding-left:0}}

/* Colorées : blocs pleine largeur, texte blanc */
.row.colored{border:none;border-radius:20px;padding:17px 16px;margin:7px 0}
.row.colored .ttitle{color:#fff}
.row.colored .tdetails{color:rgba(255,255,255,.85)}
.row.colored .chk{border-color:rgba(255,255,255,.6)}
.row.colored .chk.done{background:rgba(255,255,255,.3);border-color:rgba(255,255,255,.8)}
.row.colored .chk svg{color:#fff}
.row.colored .tedit{color:#fff;border-bottom-color:rgba(255,255,255,.6)}
.row.colored .acts button{background:rgba(255,255,255,.18);color:#fff}
.row.colored .acts button.del:hover{background:rgba(255,255,255,.35)}
.row.colored:active{background:inherit;filter:brightness(1.05)}

.done-lbl{font-family:var(--fd);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:2.5px;color:var(--ink3);padding:26px 2px 8px}
.row.faded{opacity:.5}
.row.faded .ttitle{text-decoration:line-through;text-decoration-thickness:2px;color:var(--ink3)}
.row.colored.faded .ttitle{color:rgba(255,255,255,.65)}

/* Composer bas */
.composer{position:fixed;bottom:0;left:0;right:0;z-index:100;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--paper) 65%,transparent);transition:background .7s}
.composer.hid{display:none}
.composer-in{max-width:var(--maxw);margin:0 auto;display:flex;gap:10px;align-items:flex-end}
#inp{flex:1;padding:15px 18px;font-size:17px;font-weight:500;font-family:var(--fb);word-spacing:.05em;background:var(--field);border:1.5px solid var(--hair);border-radius:22px;color:var(--ink);outline:0;resize:none;overflow:hidden;line-height:1.45;min-height:54px;box-shadow:0 6px 24px rgba(0,0,0,.07);transition:border-color .2s,background .7s;-webkit-appearance:none}
#inp::placeholder{color:var(--ink3)}
#inp:focus{border-color:var(--ink3)}
#abtn{width:54px;height:54px;border-radius:50%;border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s,background .3s,box-shadow .3s;flex-shrink:0;background:var(--ink3);box-shadow:none}
#abtn:not(:disabled){box-shadow:0 8px 20px rgba(0,0,0,.2)}
#abtn:not(:disabled):hover{transform:scale(1.06)}
#abtn:disabled{cursor:default;opacity:.5}
#abtn svg{width:23px;height:23px}

/* Bottom sheet couleurs */
.sho{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fadeIn .2s}
.sh{position:fixed;bottom:0;left:0;right:0;z-index:201;background:var(--field);color:var(--ink);border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.15);animation:sheetUp .3s cubic-bezier(.2,.9,.3,1);max-height:85vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.shh{width:38px;height:4px;background:var(--hair);border-radius:99px;margin:10px auto 4px}
.shb{padding:8px 20px 26px}
.sht{font-family:var(--fd);font-weight:700;font-size:18px;word-spacing:.06em;margin-bottom:14px;line-height:1.3;word-break:break-word}
.clbl{font-family:var(--fd);font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:700;color:var(--ink3);margin:14px 0 8px}
.cgrd{display:flex;flex-wrap:wrap;gap:9px}
.cdot{width:30px;height:30px;border-radius:50%;border:2px solid;cursor:pointer;transition:transform .15s;display:flex;align-items:center;justify-content:center;padding:0}
.cdot:hover{transform:scale(1.15)}
.cdot svg{width:13px;height:13px}
.scl{width:100%;display:flex;align-items:center;justify-content:center;padding:14px;border-radius:16px;border:none;cursor:pointer;min-height:50px;font-family:var(--fd);font-weight:700;font-size:14px;background:var(--ink);color:var(--paper);margin-top:18px}

/* Modales */
.modal-ov{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;animation:fadeIn .2s;padding:20px}
.modal-box{background:var(--field);color:var(--ink);border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.22);width:100%;max-width:400px;max-height:80vh;overflow-y:auto;padding:22px}
.modal-title{font-family:var(--fd);font-weight:800;font-size:18px;word-spacing:.05em;margin-bottom:14px}
.modal-close{float:right;border:none;background:0;font-size:20px;cursor:pointer;color:var(--ink3);padding:4px}
.cat-form{display:flex;flex-direction:column;gap:14px;margin-top:10px}
.cat-form input[type=text]{font-family:var(--fb);font-size:16px;font-weight:600;word-spacing:.05em;padding:12px 16px;border-radius:14px;border:1.5px solid var(--hair);background:var(--field);color:var(--ink);outline:0}
.cat-form input[type=text]:focus{border-color:var(--ink3)}
.cat-color-pick{display:flex;flex-wrap:wrap;gap:7px}
.cat-color-dot{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .15s;padding:0}
.cat-color-dot.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--hair)}
.cat-color-dot:hover{transform:scale(1.15)}
.move-row{display:flex;gap:8px}
.move-row button{flex:1;padding:11px;border-radius:14px;font-weight:700;font-size:13px;word-spacing:.05em;border:1.5px solid var(--hair);background:var(--field);cursor:pointer;min-height:44px;font-family:var(--fb);color:var(--ink2);transition:background .15s}
.move-row button:hover{background:var(--chip)}
.move-row button:disabled{opacity:.3;cursor:default}
.modal-actions{display:flex;gap:8px;margin-top:6px}
.modal-actions button{flex:1;padding:11px;border-radius:14px;font-weight:700;font-size:13px;word-spacing:.05em;border:none;cursor:pointer;min-height:44px;font-family:var(--fb)}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-cancel{background:var(--chip);color:var(--ink2)}
.btn-danger{background:var(--danger);color:#fff}
.sbtn{width:100%;display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:16px;border:none;cursor:pointer;min-height:50px;font-family:var(--fb);font-weight:700;font-size:14px;word-spacing:.05em;background:var(--chip);color:var(--ink);transition:background .15s;text-align:left}

/* Vide */
.es{text-align:center;padding:56px 20px;opacity:.35;display:flex;flex-direction:column;align-items:center;gap:8px;animation:fadeIn .5s}
.es p{font-family:var(--fd);font-size:19px;font-weight:700;word-spacing:.06em;color:var(--ink3)}
.hid{display:none!important}
</style>
</head>
<body data-amb="galet">
<div id="LS"><div class="sp"></div><p>DAILY FLOW</p></div>
<div id="app"><div id="wrap">
  <div class="top">
    <h1 id="dayTitle">…<small id="daySub"></small></h1>
    <div class="top-btns">
      <div class="syncd" id="syncd"></div>
      <button class="round-btn" id="ambDot" title="Ambiance"></button>

<script type="module">

const CAT_COLORS=["#FF5A36","#0052FF","#8B5CF6","#EC4899","#EF4444","#F97316","#EAB308","#22C55E","#14B8A6","#06B6D4","#D946EF","#84CC16"];
const AMBS=["galet","ivoire","brume","sauge","ciel","rosee","sable","lavande","encre"];
const AMB_PREVIEW={galet:"linear-gradient(140deg,#F3F4F1,#D8DDD4)",ivoire:"linear-gradient(140deg,#F8F6F0,#E5E0D2)",brume:"linear-gradient(140deg,#EFF2F5,#D3DAE2)",sauge:"linear-gradient(140deg,#ECF2EC,#CBDDCC)",ciel:"linear-gradient(140deg,#EDF3F8,#CDDFED)",rosee:"linear-gradient(140deg,#F7EFF1,#EBD3DA)",sable:"linear-gradient(140deg,#F5F0E7,#E8DCC4)",lavande:"linear-gradient(140deg,#F1EFF7,#D9D4EC)",encre:"linear-gradient(140deg,#232B27,#101613)"};

const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const ic=id=>`<svg><use href="#${id}"/></svg>`;
const mkId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>{const d=document.createElement("div");d.textContent=s;return d.innerHTML};
const now=()=>Date.now();
function dateFR(){const d=new Date();return["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"][d.getDay()]+" "+d.getDate()+" "+["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"][d.getMonth()]}
function autoGrow(ta){ta.style.height="auto";ta.style.height=ta.scrollHeight+"px"}
function splitText(t){const lines=(t||"").split("\n");return{title:lines[0]||"",details:lines.slice(1).join("\n").trim()}}

let tasks=[];
let CATS=[...DEFAULT_CATS];
let tab=CATS[0].id;
let amb="galet";
let editId=null;
let openId=null;
let sheetId=null;
let dragId=null;
let isDragging=false;
let justAdded=null;
let justDone=null;
let firstRender=true;

const urlUid=new URLSearchParams(location.search).get("uid");
if(urlUid)localStorage.setItem("df-uid",urlUid);
let userId=localStorage.getItem("df-uid");
if(!userId){userId=mkId();localStorage.setItem("df-uid",userId)}
let sb=null,syncing=false;

function loadLocal(){try{return JSON.parse(localStorage.getItem(SK))||[]}catch{return[]}}
function saveLocal(){localStorage.setItem(SK,JSON.stringify(tasks))}
function loadCats(){try{const c=JSON.parse(localStorage.getItem(SK+"-cats"));if(c&&Array.isArray(c)&&c.length)CATS=c}catch(e){}}
function saveCatsLocal(){localStorage.setItem(SK+"-cats",JSON.stringify(CATS))}
function loadAmb(){const a=localStorage.getItem(SK+"-amb");if(a&&AMBS.includes(a))amb=a;applyAmb()}
function applyAmb(){document.body.dataset.amb=amb;localStorage.setItem(SK+"-amb",amb);const d=$("#ambDot");if(d)d.style.background=AMB_PREVIEW[amb];renderAmbBar()}

function taskRow(t){
  return{id:t.id,user_id:userId,text:t.text||"",category:t.category||CATS[0].id,
    completed:!!t.completed,deleted:!!t.deleted,position:t.position||0,
    color:t.color||"#FFFFFF",created_at:t.created_at||now(),
    updated_at:t.updated_at||now(),deleted_at:t.deleted_at||null};
}

async function initSync(){
  try{
    sb=createClient(SB_URL,SB_KEY);
    const{data,error}=await sb.from("tasks").select("*").eq("user_id",userId);
    if(error){console.warn("Fetch error:",error);throw error}
    const{data:pc}=await sb.from("prefs").select("user_id").eq("user_id",userId);
    const isFirstEver=!pc||pc.length===0;
    if(data&&data.length>0){tasks=data.sort((a,b)=>(a.position||0)-(b.position||0));saveLocal()}
    else if(isFirstEver&&tasks.length>0){await pushAll()}
    else{tasks=[];saveLocal()}
    if(isFirstEver){await syncPrefsRow()}
    await fetchPrefsRow();
    sb.channel("tasks-"+userId).on("postgres_changes",{event:"*",schema:"public",table:"tasks",filter:`user_id=eq.${userId}`},handleRemote).subscribe();
    sb.channel("prefs-"+userId).on("postgres_changes",{event:"*",schema:"public",table:"prefs",filter:`user_id=eq.${userId}`},()=>fetchPrefsRow()).subscribe();
    syncing=true;updDot();
  }catch(e){console.warn("Sync offline:",e);syncing=false;updDot()}
}

function handleRemote(payload){
  if(payload.eventType==="DELETE"){tasks=tasks.filter(t=>t.id!==payload.old.id)}
  else{const r=payload.new;const i=tasks.findIndex(t=>t.id===r.id);if(i>=0)tasks[i]=r;else tasks.push(r)}
  tasks.sort((a,b)=>(a.position||0)-(b.position||0));
  saveLocal();
  if(document.activeElement&&document.activeElement.classList.contains("tedit"))return;
  if(isDragging)return;
  render();
}

async function pushAll(){
  if(!sb)return;
  const rows=tasks.map(t=>taskRow(t));
  if(rows.length){const{error}=await sb.from("tasks").upsert(rows,{onConflict:"id"});if(error)console.warn("Push error:",error)}
}
async function syncTask(t){
  if(!sb)return;
  const{error}=await sb.from("tasks").upsert(taskRow(t),{onConflict:"id"});
  if(error)console.warn("Sync error:",error);
}
async function hardDelete(id){
  if(!sb)return;
  const{error}=await sb.from("tasks").delete().eq("id",id).eq("user_id",userId);
  if(error)console.warn("Delete error:",error);
}
async function hardDeleteAllTrash(){
  if(!sb)return;
  const{error}=await sb.from("tasks").delete().eq("user_id",userId).eq("deleted",true);
  if(error)console.warn("Empty trash error:",error);
}
async function syncPrefsRow(){
  if(!sb)return;
  try{await sb.from("prefs").upsert({user_id:userId,cats:JSON.stringify(CATS),theme:amb,updated_at:now()},{onConflict:"user_id"})}catch(e){console.warn("Prefs sync:",e)}
}
async function fetchPrefsRow(){
  if(!sb)return;
  try{
    const{data}=await sb.from("prefs").select("cats,theme").eq("user_id",userId).single();
    if(data){
      if(data.cats){
        const c=JSON.parse(data.cats);
        if(Array.isArray(c)&&c.length){
          CATS=c.filter(x=>x.id!=="trash").map(x=>({id:x.id,label:x.label,color:x.color}));
          if(!CATS.length)CATS=[...DEFAULT_CATS];
          if(!CATS.find(c2=>c2.id===tab)&&tab!=="trash")tab=CATS[0].id;
          saveCatsLocal();
        }
      }
      if(data.theme&&AMBS.includes(data.theme)&&data.theme!==amb){amb=data.theme;applyAmb()}
      renderTabs();render();
    }
  }catch(e){}
}
function updDot(){
  const d=$("#syncd");if(!d)return;
  const on=navigator.onLine&&syncing;
  d.className="syncd "+(on?"on":"off");
  d.title=on?"Synchronisé":"Hors-ligne";
}

function getList(){
  if(tab==="trash")return tasks.filter(t=>t.deleted);
  return tasks.filter(t=>!t.deleted&&t.category===tab);
}
function addTask(txt){
  const cat=tab==="trash"?CATS[0].id:tab;
  const fl=tasks.filter(t=>!t.deleted&&t.category===cat);
  const mx=fl.length>0?Math.max(...fl.map(t=>t.position||0)):0;
  const t={id:mkId(),text:txt,category:cat,completed:false,deleted:false,position:mx+1,color:"#FFFFFF",created_at:now(),updated_at:now(),deleted_at:null};
  tasks.push(t);saveLocal();syncTask(t);
  justAdded=t.id;render();
  setTimeout(()=>{justAdded=null},600);
}
function updTask(id,fields){
  const t=tasks.find(t=>t.id===id);if(!t)return;
  Object.assign(t,fields,{updated_at:now()});
  saveLocal();syncTask(t);render();
}
function toggleTask(id){
  const t=tasks.find(t=>t.id===id);if(!t)return;
  t.completed=!t.completed;t.updated_at=now();
  saveLocal();syncTask(t);
  justDone=id;render();
  setTimeout(()=>{justDone=null;render()},700);
}
function softDelete(id){if(openId===id)openId=null;updTask(id,{deleted:true,deleted_at:now()})}
function restoreTask(id){if(openId===id)openId=null;updTask(id,{deleted:false,deleted_at:null})}
function permDelete(id){
  if(openId===id)openId=null;
  tasks=tasks.filter(t=>t.id!==id);
  saveLocal();hardDelete(id);render();
}
function emptyTrash(){
  tasks=tasks.filter(t=>!t.deleted);
  openId=null;saveLocal();hardDeleteAllTrash();render();
}

// ============================================================
// RENDER
// ============================================================
function renderAmbBar(){
  const bar=$("#ambs");if(!bar)return;
  bar.innerHTML=AMBS.map(a=>`<button data-a="${a}" class="${a===amb?"on":""}" style="background:${AMB_PREVIEW[a]}"></button>`).join("");
  bar.querySelectorAll("button").forEach(b=>{b.onclick=()=>{amb=b.dataset.a;applyAmb();syncPrefsRow()}});
}

function renderHeader(){
  const cat=CATS.find(c=>c.id===tab);
  $("#dayTitle").childNodes[0].textContent=dateFR();
  const sub=$("#daySub"),prog=$("#progress"),fill=$("#pfill");
  if(tab==="trash"){
    const n=tasks.filter(t=>t.deleted).length;
    sub.textContent=n?`${n} élément${n>1?"s":""} dans la corbeille`:"Corbeille vide";
    prog.classList.add("hid");
    return;
  }
  prog.classList.remove("hid");
  const all=tasks.filter(t=>!t.deleted&&t.category===tab);
  const done=all.filter(t=>t.completed).length;
  const rem=all.length-done;
  sub.textContent=all.length?`${rem} restante${rem>1?"s":""} · ${done} terminée${done>1?"s":""}`:"Aucune tâche pour l'instant";
  fill.style.width=(all.length?Math.round(done/all.length*100):0)+"%";
  fill.style.background=cat?cat.color:"var(--ink)";
}

function render(){
  const fl=getList();
  const active=fl.filter(t=>!t.completed);
  const done=fl.filter(t=>t.completed);
  const cat=CATS.find(c=>c.id===tab);
  const isTrash=tab==="trash";

  renderHeader();

  const composer=$("#composer");
  if(isTrash)composer.classList.add("hid");else composer.classList.remove("hid");
  if(cat)$("#inp").placeholder=`Nouvelle tâche ${cat.label}…`;

  // Bouton vider la corbeille
  const tbar=$("#trashBar");
  if(isTrash&&fl.length){
    tbar.innerHTML=`<button class="empty-trash" id="emptyTrashBtn">${ic("i-trash")} Vider la corbeille</button>`;
    tbar.querySelector("#emptyTrashBtn").onclick=()=>{
      if(confirm(`Vider la corbeille ? Les ${fl.length} élément${fl.length>1?"s":""} seront supprimés définitivement.`))emptyTrash();
    };
  }else tbar.innerHTML="";

  const tl=$("#tl"),em=$("#empt");
  if(!fl.length){
    tl.innerHTML="";em.classList.remove("hid");
    em.innerHTML=isTrash?`<p>Corbeille vide</p>`:`<p>Tout est fait !</p>`;
    firstRender=false;
    return;
  }
  em.classList.add("hid");

  let idx=0;
  const row=(t,faded)=>{
    const bgColor=t.color||"#FFFFFF";
    const colored=bgColor!=="#FFFFFF";
    const cls=["row",colored?"colored":"",faded?"faded":"",openId===t.id?"open":"",justAdded===t.id?"rise":"",firstRender?"rise":""].filter(Boolean).join(" ");
    const delay=firstRender?`animation-delay:${.05*idx}s;`:"";
    idx++;

    let ck="";
    if(!isTrash){
      if(t.completed)ck=`<button class="chk done ${justDone===t.id?"pop":""}" data-ck="${t.id}">${ic("i-chk")}</button>`;
      else ck=`<button class="chk" data-ck="${t.id}"></button>`;
    }

    let content;
    if(editId===t.id){
      content=`<div class="tcon"><textarea class="tedit" data-ei="${t.id}">${esc(t.text)}</textarea></div>`;
    }else{
      const{title,details}=splitText(t.text);
      const det=details?`<div class="tdetails">${esc(details)}</div>`:"";
      content=`<div class="tcon"><div class="ttitle">${esc(title)}</div>${det}</div>`;
    }

    let acts;
    if(isTrash){
      acts=`<button class="rest" data-rest="${t.id}" title="Restaurer">${ic("i-undo")}</button><button class="del" data-pdel="${t.id}" title="Supprimer définitivement">${ic("i-x")}</button>`;
    }else{
      acts=`<button class="grip" data-dg="${t.id}" title="Réordonner">${ic("i-grip")}</button><button data-edit="${t.id}" title="Modifier">${ic("i-pen")}</button><button data-col="${t.id}" title="Couleur">${ic("i-pal")}</button><button data-cal="${t.id}" title="Google Agenda">${ic("i-cal")}</button><button class="del" data-del="${t.id}" title="Corbeille">${ic("i-trash")}</button>`;
    }

    return`<div class="${cls}" data-tid="${t.id}" style="${delay}${colored?`background:${bgColor}`:""}"><div class="row-head">${ck}${content}</div><div class="acts">${acts}</div></div>`;
  };

  let html="";
  active.forEach(t=>{html+=row(t,false)});
  if(done.length&&!isTrash){
    html+=`<div class="done-lbl${firstRender?" rise":""}">Terminées</div>`;
    done.forEach(t=>{html+=row(t,justDone!==t.id)});
  }else{
    done.forEach(t=>{html+=row(t,justDone!==t.id)});
  }
  tl.innerHTML=html;
  firstRender=false;
  bindRows();
}

// ============================================================
// BIND
// ============================================================
function bindRows(){
  // Tap rangée = toggle actions (un seul ouvert)
  $$(".row").forEach(r=>{
    r.addEventListener("click",e=>{
      if(e.target.closest(".chk,.acts,.tedit"))return;
      if(editId)return;
      const tid=r.dataset.tid;
      openId=openId===tid?null:tid;
      render();
    });
  });

  $$("[data-ck]").forEach(b=>{b.onclick=e=>{e.stopPropagation();toggleTask(b.dataset.ck)}});

  // Édition via crayon
  $$("[data-edit]").forEach(b=>{b.onclick=e=>{
    e.stopPropagation();
    editId=b.dataset.edit;render();
    const ta=$(`[data-ei="${editId}"]`);
    if(ta){autoGrow(ta);ta.focus();ta.selectionStart=ta.value.length}
  }});
  $$("[data-ei]").forEach(ta=>{
    const id=ta.dataset.ei;
    ta.oninput=()=>autoGrow(ta);
    ta.onblur=()=>{
      const v=ta.value.trim();
      editId=null;
      if(v)updTask(id,{text:v});else render();
    };
    ta.onkeydown=e=>{
      if(e.key==="Escape"){editId=null;render()}
      if(e.key==="Enter"&&(e.ctrlKey||e.metaKey))ta.blur();
    };
  });

  // Couleur
  $$("[data-col]").forEach(b=>{b.onclick=e=>{e.stopPropagation();openSheet(b.dataset.col)}});
  // Google Agenda direct
  $$("[data-cal]").forEach(b=>{b.onclick=e=>{
    e.stopPropagation();
    const t=tasks.find(t=>t.id===b.dataset.cal);if(!t)return;
    const{title,details}=splitText(t.text);
    let url=`https://www.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}`;
    if(details)url+=`&details=${encodeURIComponent(details)}`;
    window.open(url,"_blank");
  }});
  // Corbeille / restaurer / suppression définitive
  $$("[data-del]").forEach(b=>{b.onclick=e=>{e.stopPropagation();softDelete(b.dataset.del)}});
  $$("[data-rest]").forEach(b=>{b.onclick=e=>{e.stopPropagation();restoreTask(b.dataset.rest)}});
  $$("[data-pdel]").forEach(b=>{b.onclick=e=>{
    e.stopPropagation();
    if(confirm("Supprimer définitivement cette tâche ?"))permDelete(b.dataset.pdel);
  }});
  // Drag
  $$("[data-dg]").forEach(h=>{h.onpointerdown=e=>{
    e.preventDefault();e.stopPropagation();
    const r=h.closest(".row");if(!r)return;
    dragId=r.dataset.tid;isDragging=true;
    r.classList.add("drg");
  }});
}

// ============================================================
// BOTTOM SHEET couleurs
// ============================================================
function openSheet(id){
  sheetId=id;renderSheet();
  $("#shov").classList.remove("hid");
  $("#shee").classList.remove("hid");
}
function closeSheet(){
  sheetId=null;
  $("#shov").classList.add("hid");
  $("#shee").classList.add("hid");
  render();
}
function renderSheet(){
  const t=tasks.find(t=>t.id===sheetId);if(!t)return;
  const bd=$("#shbd");
  const{title}=splitText(t.text);
  const cur=t.color||"#FFFFFF";
  const dot=(c,sel)=>`<button class="cdot" style="background:${c==="#FFFFFF"?"var(--field)":c};border-color:${sel?"var(--ink)":"var(--hair)"}" data-sc="${c}">${sel?`<svg style="color:${c==="#FFFFFF"?"var(--ink2)":"#fff"}"><use href="#i-chk"/></svg>`:""}</button>`;
  let h=`<div class="sht">${esc(title)}</div>`;
  h+=`<div class="clbl">Couleurs pleines</div><div class="cgrd">${dot("#FFFFFF",cur==="#FFFFFF")}${SOLIDS.map(c=>dot(c,cur===c)).join("")}</div>`;
  h+=`<div class="clbl">Pastel</div><div class="cgrd">${PASTELS.map(c=>dot(c,cur===c)).join("")}</div>`;
  h+=`<button class="scl" data-sa="close">Fermer</button>`;
  bd.innerHTML=h;
  bd.querySelectorAll("[data-sc]").forEach(d=>{d.onclick=()=>{updTask(sheetId,{color:d.dataset.sc});renderSheet()}});
  bd.querySelector("[data-sa=close]").onclick=closeSheet;
}

// ============================================================
// TABS
// ============================================================
function renderTabs(){
  const bar=$("#tabs");bar.innerHTML="";
  CATS.forEach(c=>{
    const b=document.createElement("button");
    b.className="tab"+(tab===c.id?" on":"");
    b.style.setProperty("--tabc",c.color);
    b.textContent=c.label;
    b.onclick=()=>{tab=c.id;editId=null;openId=null;renderTabs();render()};
    let lp;
    b.addEventListener("pointerdown",()=>{lp=setTimeout(()=>openCatEditor(c.id),500)});
    b.addEventListener("pointerup",()=>clearTimeout(lp));
    b.addEventListener("pointerleave",()=>clearTimeout(lp));
    bar.appendChild(b);
  });
  const addBtn=document.createElement("button");
  addBtn.className="tab-add";addBtn.textContent="+";
  addBtn.onclick=()=>openCatEditor(null);
  bar.appendChild(addBtn);
  const tb2=document.createElement("button");
  tb2.className="tab trash-tab"+(tab==="trash"?" on":"");
  tb2.style.setProperty("--tabc","var(--ink2)");
  tb2.textContent=TRASH_LABEL;
  tb2.onclick=()=>{tab="trash";editId=null;openId=null;renderTabs();render()};
  bar.appendChild(tb2);
}

// ============================================================
// CATEGORY EDITOR
// ============================================================
function closeModal(){$("#modalOv").classList.add("hid")}
function openCatEditor(catId){
  const existing=catId?CATS.find(c=>c.id===catId):null;
  const idx=existing?CATS.indexOf(existing):-1;
  const ov=$("#modalOv");ov.classList.remove("hid");
  let selColor=existing?existing.color:CAT_COLORS[CATS.length%CAT_COLORS.length];
  let h=`<div class="modal-box"><button class="modal-close" id="ceClose">✕</button><div class="modal-title">${existing?"Modifier la catégorie":"Nouvelle catégorie"}</div><div class="cat-form">`;
  h+=`<input type="text" id="ceName" placeholder="Nom de la catégorie" value="${existing?esc(existing.label):""}">`;
  h+=`<div><div class="clbl" style="margin-top:0">Couleur</div><div class="cat-color-pick">`;
  CAT_COLORS.forEach(c=>{h+=`<button class="cat-color-dot${c===selColor?" sel":""}" data-cec="${c}" style="background:${c}"></button>`});
  h+=`</div></div>`;
  if(existing&&CATS.length>1){
    h+=`<div><div class="clbl" style="margin-top:0">Position</div><div class="move-row"><button id="ceLeft" ${idx===0?"disabled":""}>← Déplacer à gauche</button><button id="ceRight" ${idx===CATS.length-1?"disabled":""}>Déplacer à droite →</button></div></div>`;
  }
  h+=`</div><div class="modal-actions"><button class="btn-cancel" id="ceCnc">Annuler</button>`;
  if(existing&&CATS.length>1)h+=`<button class="btn-danger" id="ceDel">Supprimer</button>`;
  h+=`<button class="btn-primary" id="ceSave">${existing?"Enregistrer":"Créer"}</button></div></div>`;
  ov.innerHTML=h;
  ov.querySelector("#ceClose").onclick=closeModal;
  ov.querySelector("#ceCnc").onclick=closeModal;
  ov.querySelectorAll("[data-cec]").forEach(b=>{b.onclick=()=>{selColor=b.dataset.cec;ov.querySelectorAll(".cat-color-dot").forEach(x=>x.classList.toggle("sel",x.dataset.cec===selColor))}});
  const moveCat=dir=>{
    const i=CATS.indexOf(existing);const j=i+dir;
    if(j<0||j>=CATS.length)return;
    [CATS[i],CATS[j]]=[CATS[j],CATS[i]];
    saveCatsLocal();syncPrefsRow();renderTabs();
    openCatEditor(catId);
  };
  const lb=ov.querySelector("#ceLeft");if(lb)lb.onclick=()=>moveCat(-1);
  const rb=ov.querySelector("#ceRight");if(rb)rb.onclick=()=>moveCat(1);
  const db=ov.querySelector("#ceDel");
  if(db){db.onclick=()=>{
    if(!confirm(`Supprimer la catégorie "${existing.label}" ? Ses tâches iront dans "${CATS.find(c=>c!==existing).label}".`))return;
    const target=CATS.find(c=>c!==existing).id;
    tasks.filter(t=>t.category===catId).forEach(t=>{t.category=target;t.updated_at=now();syncTask(t)});
    saveLocal();
    CATS=CATS.filter(c=>c.id!==catId);
    saveCatsLocal();syncPrefsRow();
    if(tab===catId)tab=CATS[0].id;
    closeModal();renderTabs();render();
  }}
  ov.querySelector("#ceSave").onclick=()=>{
    const name=ov.querySelector("#ceName").value.trim();if(!name)return;
    if(existing){existing.label=name;existing.color=selColor}
    else{const nc={id:mkId(),label:name,color:selColor};CATS.push(nc);tab=nc.id}
    saveCatsLocal();syncPrefsRow();closeModal();renderTabs();render();
  };
}

// ============================================================
// EXPORT / IMPORT + MENU
// ============================================================
function exportData(){
  const data={tasks,cats:CATS};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download="daily-flow-backup.json";
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
function importData(file){
  const reader=new FileReader();
  reader.onload=async()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!data.tasks||!Array.isArray(data.tasks)){alert("Fichier non reconnu.");return}
      tasks=data.tasks;saveLocal();
      if(data.cats&&Array.isArray(data.cats)&&data.cats.length){CATS=data.cats;saveCatsLocal()}
      if(sb){await pushAll();await syncPrefsRow()}
      renderTabs();render();
      alert("Import réussi !");
    }catch(e){alert("Erreur d'import : "+e.message)}
  };
  reader.readAsText(file);
}
function openMenu(){
  const ov=$("#modalOv");ov.classList.remove("hid");
  let h=`<div class="modal-box"><button class="modal-close" id="menuClose">✕</button><div class="modal-title">Menu</div>`;
  h+=`<button class="sbtn" id="menuExport" style="margin-bottom:8px">📥 Exporter les données (JSON)</button>`;
  h+=`<button class="sbtn" id="menuImport">📤 Importer des données</button>`;
  h+=`</div>`;
  ov.innerHTML=h;
  ov.querySelector("#menuClose").onclick=closeModal;
  ov.querySelector("#menuExport").onclick=()=>{exportData();closeModal()};
  ov.querySelector("#menuImport").onclick=()=>{closeModal();$("#importFile").click()};
}

// ============================================================
// COMPOSER
// ============================================================
function initInput(){
  const inp=$("#inp"),btn=$("#abtn");
  inp.addEventListener("input",()=>{
    autoGrow(inp);
    const cat=CATS.find(c=>c.id===tab)||CATS[0];
    btn.disabled=!inp.value.trim();
    btn.style.background=inp.value.trim()?cat.color:"";
  });
  inp.addEventListener("keydown",e=>{
    if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();submitTask()}
  });
  btn.onclick=submitTask;
  function submitTask(){
    if(tab==="trash")return;
    const t=inp.value.trim();if(!t)return;
    addTask(t);
    inp.value="";inp.style.height="auto";
    btn.disabled=true;btn.style.background="";
  }
}

// ============================================================
// INIT
// ============================================================
async function init(){
  tasks=loadLocal();
  loadCats();
  loadAmb();

  $("#dayTitle").insertBefore(document.createTextNode(dateFR()),$("#daySub"));
  renderTabs();render();initInput();
  $("#shov").onclick=closeSheet;
  $("#menuBtn").onclick=openMenu;
  $("#ambDot").onclick=()=>$("#ambs").classList.toggle("open");
  $("#importFile").onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=""};

  window.addEventListener("online",()=>{updDot();if(syncing)pushAll()});
  window.addEventListener("offline",updDot);

  document.addEventListener("pointermove",ev=>{
    if(!dragId)return;ev.preventDefault();
    const tl=$("#tl");if(!tl)return;
    const dragRow=tl.querySelector(`[data-tid="${dragId}"]`);if(!dragRow)return;
    const rows=[...tl.querySelectorAll(".row")];
    for(const c of rows){
      if(c===dragRow)continue;
      const r=c.getBoundingClientRect();const mid=r.top+r.height/2;
      if(ev.clientY<mid&&c.compareDocumentPosition(dragRow)&Node.DOCUMENT_POSITION_FOLLOWING){tl.insertBefore(dragRow,c);break}
      else if(ev.clientY>mid&&c.compareDocumentPosition(dragRow)&Node.DOCUMENT_POSITION_PRECEDING){tl.insertBefore(dragRow,c.nextSibling);break}
    }
  });
  document.addEventListener("pointerup",async()=>{
    if(!dragId)return;
    const tl=$("#tl");
    const dragRow=tl?tl.querySelector(`[data-tid="${dragId}"]`):null;
    if(dragRow)dragRow.classList.remove("drg");
    if(tl){
      const newOrder=[...tl.querySelectorAll(".row")].map(c=>c.dataset.tid);
      const taskMap=new Map(tasks.map(t=>[t.id,t]));
      newOrder.forEach((id,i)=>{const t=taskMap.get(id);if(t){t.position=i;t.updated_at=now()}});
      tasks.sort((a,b)=>(a.position||0)-(b.position||0));
    }
    dragId=null;saveLocal();
    if(sb){try{await sb.from("tasks").upsert(tasks.map(t=>taskRow(t)),{onConflict:"id"})}catch(e){console.warn(e)}}
    setTimeout(()=>{isDragging=false},1500);
  });

  $("#LS").classList.add("h");
  $("#app").style.display="block";
  setTimeout(()=>{const ls=$("#LS");if(ls)ls.remove()},400);

  await initSync();
  updDot();render();
}

if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);
else init();
</script>
