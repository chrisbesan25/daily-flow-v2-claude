<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F3F4F1">
<title>Daily Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--fd:'Bricolage Grotesque',system-ui,sans-serif;--fb:'Schibsted Grotesk',system-ui,sans-serif;--maxw:560px;--danger:#EF4444;--success:#10B981}
body[data-amb="galet"]{--paper:#F3F4F1;--ink:#16211C;--ink2:#5C6B63;--ink3:#94A29B;--hair:rgba(22,33,28,.1);--chip:rgba(22,33,28,.055);--field:#FFFFFF}
body[data-amb="ivoire"]{--paper:#F8F6F0;--ink:#211D16;--ink2:#6B6355;--ink3:#A29A8C;--hair:rgba(33,29,22,.1);--chip:rgba(33,29,22,.055);--field:#FFFFFF}
body[data-amb="brume"]{--paper:#EFF2F5;--ink:#161D24;--ink2:#5A6774;--ink3:#93A0AC;--hair:rgba(22,29,36,.1);--chip:rgba(22,29,36,.055);--field:#FFFFFF}
body[data-amb="sauge"]{--paper:#ECF2EC;--ink:#152018;--ink2:#57685C;--ink3:#8FA095;--hair:rgba(21,32,24,.1);--chip:rgba(21,32,24,.055);--field:#FBFDFB}
body[data-amb="ciel"]{--paper:#EDF3F8;--ink:#131E28;--ink2:#54697A;--ink3:#8CA1B1;--hair:rgba(19,30,40,.1);--chip:rgba(19,30,40,.055);--field:#FBFDFF}
body[data-amb="rosee"]{--paper:#F7EFF1;--ink:#241619;--ink2:#75585E;--ink3:#AC9097;--hair:rgba(36,22,25,.1);--chip:rgba(36,22,25,.055);--field:#FFFCFD}
body[data-amb="sable"]{--paper:#F5F0E7;--ink:#221C10;--ink2:#6F6450;--ink3:#A69A82;--hair:rgba(34,28,16,.1);--chip:rgba(34,28,16,.055);--field:#FFFDF8}
body[data-amb="lavande"]{--paper:#F1EFF7;--ink:#191624;--ink2:#605A75;--ink3:#9791AC;--hair:rgba(25,22,36,.1);--chip:rgba(25,22,36,.055);--field:#FCFBFF}
body[data-amb="encre"]{--paper:#151A18;--ink:#F0F3F1;--ink2:#9BA8A1;--ink3:#5E6A64;--hair:rgba(240,243,241,.12);--chip:rgba(240,243,241,.08);--field:#1E2422}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent}
body{font-family:var(--fb);color:var(--ink);background:var(--paper);min-height:100vh;-webkit-font-smoothing:antialiased;overscroll-behavior:none;transition:background .7s ease,color .7s ease}
#wrap{max-width:var(--maxw);margin:0 auto;padding:26px 20px 140px}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.rise{animation:rise .55s cubic-bezier(.2,.9,.3,1) both}

#LS{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#F3F4F1;transition:opacity .3s}
#LS.h{opacity:0;pointer-events:none}
#LS .sp{width:30px;height:30px;border:3px solid rgba(22,33,28,.15);border-top-color:#16211C;border-radius:50%;animation:spin .7s linear infinite}
#LS p{margin-top:12px;font-family:var(--fd);font-weight:800;font-size:11px;letter-spacing:3px;color:#94A29B}
#app{display:none}

/* Header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{font-family:var(--fd);font-weight:800;font-size:30px;letter-spacing:-.5px;word-spacing:.06em;line-height:1.05}
h1 small{display:block;font-size:15px;font-weight:500;font-family:var(--fb);color:var(--ink2);letter-spacing:0;word-spacing:.05em;margin-top:6px}
.top-btns{display:flex;gap:8px;flex-shrink:0;margin-top:4px}
.round-btn{width:40px;height:40px;border-radius:50%;border:none;background:var(--chip);color:var(--ink2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.round-btn:hover{transform:scale(1.08)}
.round-btn svg{width:17px;height:17px}
#ambDot{border:2px solid var(--hair)}
/* Pastille d'état de la synchro, posée sur le bouton menu */
#menuBtn{position:relative}
.syncd{position:absolute;top:-1px;right:1px;width:10px;height:10px;border-radius:50%;border:2px solid var(--paper);background:var(--ink3);transition:background .3s}
.syncd.ok{background:var(--success)}.syncd.wait{background:#F59E0B}.syncd.alert{background:var(--danger)}

.ambs{display:flex;gap:8px;justify-content:flex-end;max-height:0;overflow:hidden;opacity:0;transition:max-height .4s cubic-bezier(.2,.9,.3,1),opacity .3s,margin .4s;margin:0}
.ambs.open{max-height:50px;opacity:1;margin:14px 0 2px}
.ambs button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .2s;padding:0;flex-shrink:0}
.ambs button.on{transform:scale(1.22)}

.progress{margin:20px 0 4px}
.progress-track{height:3px;border-radius:99px;background:var(--hair);overflow:hidden}
.progress-fill{height:100%;border-radius:99px;width:0%;transition:width .8s cubic-bezier(.2,.9,.3,1),background .4s}

/* Onglets soulignés */
.tabs{display:flex;gap:22px;overflow-x:auto;padding:18px 2px 0;scrollbar-width:none;align-items:baseline}
.tabs::-webkit-scrollbar{display:none}
.tab{border:none;background:0;font-family:var(--fd);font-weight:700;font-size:19px;letter-spacing:0;word-spacing:.05em;color:var(--ink3);cursor:pointer;padding:6px 0 10px;position:relative;white-space:nowrap;user-select:none;-webkit-user-select:none;transition:color .25s}
.tab.on{color:var(--tabc,var(--ink))}
.tab.on::after{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:99px;background:var(--tabc,var(--ink))}
.tab.trash-tab{font-size:16px;font-weight:600;margin-left:auto}
.tab-add{border:none;background:0;color:var(--ink3);font-size:21px;font-weight:500;cursor:pointer;padding:0 2px 8px;transition:color .2s}
.tab-add:hover{color:var(--ink2)}

/* Vider la corbeille */
.empty-trash{display:flex;align-items:center;gap:8px;margin:16px 0 4px;padding:12px 16px;border-radius:16px;border:1.5px solid rgba(239,68,68,.3);background:transparent;color:var(--danger);font-family:var(--fb);font-weight:700;font-size:14px;word-spacing:.05em;cursor:pointer;transition:background .2s}
.empty-trash:hover{background:rgba(239,68,68,.08)}
.empty-trash svg{width:16px;height:16px}

/* Rangées */
.list{margin-top:14px}
.row{padding:17px 2px;border-bottom:1px solid var(--hair);cursor:pointer;transition:background .25s;border-radius:14px}
.row:active{background:var(--chip)}
.row.drg{opacity:.5;background:var(--chip)}
.row-head{display:flex;align-items:flex-start;gap:14px}
.chk{flex-shrink:0;width:34px;height:34px;border-radius:50%;border:2.5px solid var(--ink3);background:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;padding:0}
.chk:hover{border-color:var(--ink);transform:scale(1.08)}
.chk.done{background:var(--ink);border-color:var(--ink)}
.chk.pop{animation:pop .4s cubic-bezier(.2,.9,.3,1)}
.chk svg{width:16px;height:16px;color:var(--paper)}
.tcon{flex:1;min-width:0;padding-top:4px}
.ttitle{font-family:var(--fd);font-weight:700;font-size:21px;letter-spacing:-.1px;word-spacing:.08em;line-height:1.25;word-break:break-word;overflow-wrap:anywhere}
.tdetails{font-size:15.5px;font-weight:500;color:var(--ink2);line-height:1.55;word-spacing:.05em;margin-top:6px;white-space:pre-wrap;word-break:break-word}
.tedit{width:100%;background:0;border:none;border-bottom:2px solid var(--ink2);font-size:17px;font-weight:500;font-family:var(--fb);word-spacing:.05em;padding:2px 0;color:var(--ink);outline:0;resize:none;overflow:hidden;line-height:1.5}

/* Actions au tap */
.acts{display:flex;gap:8px;max-height:0;overflow:hidden;opacity:0;transition:max-height .35s cubic-bezier(.2,.9,.3,1),opacity .25s,margin .35s;margin:0;padding-left:48px;flex-wrap:wrap}
.row.open .acts{max-height:64px;opacity:1;margin-top:14px}
.acts button{width:42px;height:42px;border-radius:50%;border:none;background:var(--chip);color:var(--ink2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s,background .2s;flex-shrink:0}
.acts button:hover{transform:scale(1.1)}
.acts button.del:hover{background:var(--danger);color:#fff}
.acts button.rest:hover{background:var(--success);color:#fff}
.acts svg{width:18px;height:18px}
.acts .grip{cursor:grab;touch-action:none}
.acts .grip:active{cursor:grabbing}
@media(max-width:420px){.acts{padding-left:0}}

/* Colorées : blocs pleine largeur, texte blanc */
.row.colored{border:none;border-radius:20px;padding:17px 16px;margin:7px 0}
.row.colored .ttitle{color:#fff}
.row.colored .tdetails{color:rgba(255,255,255,.85)}
.row.colored .chk{border-color:rgba(255,255,255,.6)}
.row.colored .chk.done{background:rgba(255,255,255,.3);border-color:rgba(255,255,255,.8)}
.row.colored .chk svg{color:#fff}
.row.colored .tedit{color:#fff;border-bottom-color:rgba(255,255,255,.6)}
.row.colored .acts button{background:rgba(255,255,255,.18);color:#fff}
.row.colored .acts button.del:hover{background:rgba(255,255,255,.35)}
.row.colored:active{background:inherit;filter:brightness(1.05)}

.done-lbl{font-family:var(--fd);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:2.5px;color:var(--ink3);padding:26px 2px 8px}
.row.faded{opacity:.5}
.row.faded .ttitle{text-decoration:line-through;text-decoration-thickness:2px;color:var(--ink3)}
.row.colored.faded .ttitle{color:rgba(255,255,255,.65)}

/* Composer bas */
.composer{position:fixed;bottom:0;left:0;right:0;z-index:100;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--paper) 65%,transparent);transition:background .7s}
.composer.hid{display:none}
.composer-in{max-width:var(--maxw);margin:0 auto;display:flex;gap:10px;align-items:flex-end}
#inp{flex:1;padding:15px 18px;font-size:17px;font-weight:500;font-family:var(--fb);word-spacing:.05em;background:var(--field);border:1.5px solid var(--hair);border-radius:22px;color:var(--ink);outline:0;resize:none;overflow:hidden;line-height:1.45;min-height:54px;box-shadow:0 6px 24px rgba(0,0,0,.07);transition:border-color .2s,background .7s;-webkit-appearance:none}
#inp::placeholder{color:var(--ink3)}
#inp:focus{border-color:var(--ink3)}
#abtn{width:54px;height:54px;border-radius:50%;border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s,background .3s,box-shadow .3s;flex-shrink:0;background:var(--ink3);box-shadow:none}
#abtn:not(:disabled){box-shadow:0 8px 20px rgba(0,0,0,.2)}
#abtn:not(:disabled):hover{transform:scale(1.06)}
#abtn:disabled{cursor:default;opacity:.5}
#abtn svg{width:23px;height:23px}

/* Bottom sheet couleurs */
.sho{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fadeIn .2s}
.sh{position:fixed;bottom:0;left:0;right:0;z-index:201;background:var(--field);color:var(--ink);border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.15);animation:sheetUp .3s cubic-bezier(.2,.9,.3,1);max-height:85vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.shh{width:38px;height:4px;background:var(--hair);border-radius:99px;margin:10px auto 4px}
.shb{padding:8px 20px 26px}
.sht{font-family:var(--fd);font-weight:700;font-size:18px;word-spacing:.06em;margin-bottom:14px;line-height:1.3;word-break:break-word}
.clbl{font-family:var(--fd);font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:700;color:var(--ink3);margin:14px 0 8px}
.cgrd{display:flex;flex-wrap:wrap;gap:9px}
.cdot{width:30px;height:30px;border-radius:50%;border:2px solid;cursor:pointer;transition:transform .15s;display:flex;align-items:center;justify-content:center;padding:0}
.cdot:hover{transform:scale(1.15)}
.cdot svg{width:13px;height:13px}
.scl{width:100%;display:flex;align-items:center;justify-content:center;padding:14px;border-radius:16px;border:none;cursor:pointer;min-height:50px;font-family:var(--fd);font-weight:700;font-size:14px;background:var(--ink);color:var(--paper);margin-top:18px}
.move-grid{display:flex;flex-wrap:wrap;gap:8px}
.move-pill{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:99px;border:1.5px solid var(--hair);background:var(--field);font-family:var(--fd);font-weight:700;font-size:14px;word-spacing:.05em;color:var(--ink);cursor:pointer;transition:background .15s}
.move-pill:hover{background:var(--chip)}
.move-pill i{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* Modales */
.modal-ov{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;animation:fadeIn .2s;padding:20px}
.modal-box{background:var(--field);color:var(--ink);border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.22);width:100%;max-width:400px;max-height:80vh;overflow-y:auto;padding:22px}
.modal-title{font-family:var(--fd);font-weight:800;font-size:18px;word-spacing:.05em;margin-bottom:14px}
.modal-close{float:right;border:none;background:0;font-size:20px;cursor:pointer;color:var(--ink3);padding:4px}
.cat-form{display:flex;flex-direction:column;gap:14px;margin-top:10px}
.cat-form input[type=text]{font-family:var(--fb);font-size:16px;font-weight:600;word-spacing:.05em;padding:12px 16px;border-radius:14px;border:1.5px solid var(--hair);background:var(--field);color:var(--ink);outline:0}
.cat-form input[type=text]:focus{border-color:var(--ink3)}
.cat-color-pick{display:flex;flex-wrap:wrap;gap:7px}
.cat-color-dot{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .15s;padding:0}
.cat-color-dot.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--hair)}
.cat-color-dot:hover{transform:scale(1.15)}
.move-row{display:flex;gap:8px}
.move-row button{flex:1;padding:11px;border-radius:14px;font-weight:700;font-size:13px;word-spacing:.05em;border:1.5px solid var(--hair);background:var(--field);cursor:pointer;min-height:44px;font-family:var(--fb);color:var(--ink2);transition:background .15s}
.move-row button:hover{background:var(--chip)}
.move-row button:disabled{opacity:.3;cursor:default}
.modal-actions{display:flex;gap:8px;margin-top:6px}
.modal-actions button{flex:1;padding:11px;border-radius:14px;font-weight:700;font-size:13px;word-spacing:.05em;border:none;cursor:pointer;min-height:44px;font-family:var(--fb)}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-cancel{background:var(--chip);color:var(--ink2)}
.btn-danger{background:var(--danger);color:#fff}
.sbtn{width:100%;display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:16px;border:none;cursor:pointer;min-height:50px;font-family:var(--fb);font-weight:700;font-size:14px;word-spacing:.05em;background:var(--chip);color:var(--ink);transition:background .15s;text-align:left}

/* Vide */
.es{text-align:center;padding:56px 20px;opacity:.35;display:flex;flex-direction:column;align-items:center;gap:8px;animation:fadeIn .5s}
.es p{font-family:var(--fd);font-size:19px;font-weight:700;word-spacing:.06em;color:var(--ink3)}
.hid{display:none!important}

/* Menu : bloc Synchronisation et compte. Libellés en ink2 (ink3 n'atteint pas 4,5 sur fond blanc) */
.sy-lbl{font-family:var(--fd);font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:700;color:var(--ink2);margin:16px 0 8px}
.sy-card{background:var(--chip);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.sy-dot{flex-shrink:0;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--ink3)}
.sy-dot.ok{background:var(--success)}.sy-dot.wait{background:#F59E0B}.sy-dot.alert{background:var(--danger)}
.sy-t{font-weight:600;font-size:15px;line-height:1.4}
.sy-s{font-size:13.5px;color:var(--ink2);line-height:1.45;margin-top:3px}
.sy-btn{width:100%;display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:16px;border:1.5px solid var(--hair);background:var(--field);min-height:50px;font-family:var(--fb);font-weight:700;font-size:14px;word-spacing:.05em;color:var(--ink);text-align:left;cursor:pointer;margin-top:8px}
.sy-btn svg{width:17px;height:17px;flex-shrink:0}
.sy-acc{font-size:14px;color:var(--ink2);line-height:1.45;margin-bottom:8px;word-break:break-word}

/* Questions de conflit */
.cf-n{font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.cf-p{font-size:14.5px;color:var(--ink2);line-height:1.5;margin:-4px 0 14px}
.cf-opt{position:relative;width:100%;text-align:left;background:var(--field);border:2px solid var(--hair);border-radius:16px;padding:14px 44px 14px 16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;font-family:var(--fb);color:var(--ink);margin-bottom:10px}
.cf-opt.sel{border-color:var(--ink)}
.cf-opt.cf-static{cursor:default;padding-right:16px}
.cf-k{font-family:var(--fd);font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:700;color:var(--ink2)}
.cf-v{font-family:var(--fd);font-weight:700;font-size:17px;line-height:1.3;word-break:break-word}
.cf-m{font-size:13px;color:var(--ink2);line-height:1.45}
.cf-d{white-space:pre-wrap;word-break:break-word}
.cf-c{display:flex;align-items:center;gap:6px}
.cf-c i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--hair);display:inline-block}
.cf-ck{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--paper);display:none;align-items:center;justify-content:center}
.cf-opt.sel .cf-ck{display:flex}
.cf-ck svg{width:12px;height:12px}
.cf-go{width:100%;min-height:50px;padding:14px;border-radius:16px;border:none;background:var(--ink);color:var(--paper);font-family:var(--fd);font-weight:700;font-size:14px;cursor:pointer;margin-top:4px}
.cf-go:disabled{opacity:.4;cursor:default}

/* Écran de connexion */
#login{position:fixed;inset:0;z-index:400;background:var(--paper);color:var(--ink);overflow-y:auto}
.lg-in{max-width:var(--maxw);margin:0 auto;padding:96px 24px 40px;display:flex;flex-direction:column;gap:22px}
.lg-mark{font-family:var(--fd);font-weight:800;font-size:11px;letter-spacing:3px;color:var(--ink2)}
.lg-form{display:flex;flex-direction:column;gap:14px}
.lg-f{display:flex;flex-direction:column;gap:6px}
.lg-f span{font-size:13px;font-weight:600;color:var(--ink2)}
.lg-f input{font-family:var(--fb);font-size:16px;font-weight:600;padding:12px 16px;border-radius:14px;border:1.5px solid var(--hair);background:var(--field);color:var(--ink);outline:0;min-height:48px;-webkit-appearance:none}
.lg-f input:focus{border-color:var(--ink3)}
.lg-go{width:100%;min-height:50px;padding:14px;border-radius:16px;border:none;background:var(--ink);color:var(--paper);font-family:var(--fd);font-weight:700;font-size:14px;cursor:pointer;margin-top:8px}
.lg-go:disabled{opacity:.6;cursor:default}
.lg-alt{width:100%;min-height:50px;padding:14px;border-radius:16px;border:none;background:var(--chip);color:var(--ink);font-family:var(--fd);font-weight:700;font-size:14px;cursor:pointer}
.lg-note{font-size:13.5px;color:var(--ink2);line-height:1.5}
</style>
</head>
<body data-amb="galet">
<div id="LS"><div class="sp"></div><p>DAILY FLOW</p></div>
<div id="app"><div id="wrap">
  <div class="top">
    <h1 id="dayTitle">…<small id="daySub"></small></h1>
    <div class="top-btns">
      <button class="round-btn" id="ambDot" title="Ambiance"></button>
      <button class="round-btn" id="menuBtn" title="Menu" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg><span class="syncd" id="syncd"></span></button>
    </div>

const FIELDS=["text","category","completed","deleted","position","color","deleted_at"];

const FIELD_LBL={text:"texte",category:"catégorie",completed:"état fait ou à faire",deleted:"présence dans la corbeille",color:"couleur"};

/* Normalisation commune à la copie locale et à la version en ligne, avant toute comparaison */
function nt(t){return{text:String(t.text??""),category:String(t.category??""),completed:!!t.completed,deleted:!!t.deleted,position:Number(t.position)||0,color:String(t.color||"#FFFFFF"),deleted_at:t.deleted_at==null?null:Number(t.deleted_at)}}
function diffF(a,b){const A=nt(a),B=nt(b);return FIELDS.filter(f=>A[f]!==B[f])}
function toLocal(r){return{id:r.id,...nt(r),created_at:Number(r.created_at)||now(),updated_at:Number(r.updated_at)||0}}
function toBase(r){return{v:Number(r.updated_at),...nt(r)}}
function catsStr(c){let a=c;if(typeof a==="string"){try{a=JSON.parse(a)}catch(e){a=[]}}if(!Array.isArray(a))a=[];return JSON.stringify(a.filter(x=>x&&x.id&&x.id!=="trash").map(x=>({id:String(x.id),label:String(x.label??""),color:String(x.color??"")})))}

function byPos(a,b){return(a.position||0)-(b.position||0)}

function localChanges(){

  for(const t of tasks){seen.add(t.id);const b=base[t.id];if(!b||diffF(t,b).length)out.push(t.id)}
  for(const id in base)if(!seen.has(id))out.push(id);
  return out;
}
function prefsChanged(){if(!pbase)return false;const p=prefsLocal();return p.cats!==pbase.cats||p.theme!==pbase.theme}

function setLocal(obj){const i=tasks.findIndex(t=>t.id===obj.id);if(i>=0)tasks[i]={...tasks[i],...obj};else tasks.push(obj)}

/* ============================================================
   SYNCHRO : erreurs et état du réseau
   ============================================================ */
function isNetErr(e){if(!e)return false;if(e.status===0||e.name==="AuthRetryableFetchError")return true;return/fetch|network|load failed|timeout|connexion/i.test(String(e.message||e))}
function errKind(res){
  if(!res||!res.error)return null;
  const e=res.error,st=res.status;
  if(st===0||isNetErr(e))return"net";
  if(st===401||e.code==="PGRST301"||e.code==="PGRST303"||/jwt/i.test(e.message||""))return"auth";
  if(st===409||e.code==="23505")return"conflict";
  return"other";
}
function netFail(){if(netState!=="offline"){netState="offline";offlineSince=now()}updDot();if(document.visibilityState==="visible")scheduleSync(20000)}
function netOk(){netState="online";offlineSince=null}
async function tryRefresh(){
  try{
    const{data,error}=await sb.auth.refreshSession();
    if(data&&data.session){token=data.session.access_token;return true}
    if(error&&isNetErr(error)){netFail();return false}

  }catch(e){if(isNetErr(e))netFail();return false}
}

/* ============================================================
   SYNCHRO : file unique, jamais deux synchros en parallèle
   ============================================================ */
function scheduleSync(ms){clearTimeout(syncTimer);syncTimer=setTimeout(()=>{syncTimer=null;syncNow("auto")},ms)}
function syncNow(why){
  if(runP){syncAgain=true;return runP}
  clearTimeout(syncTimer);syncTimer=null;
  runP=(async()=>{
    let n=0;
    do{syncAgain=false;await doSync(why);n++}while(syncAgain&&n<4);
    if(syncAgain)scheduleSync(3000);
  })().finally(()=>{runP=null;refreshUI()});
  return runP;
}

async function doSync(why){
  if(!sb||authState!=="ok"||!uid)return;
  if(isDragging){scheduleSync(1700);return}
  syncing=true;updDot();

  try{
    const[rt,rp]=await Promise.all([
      sb.from("tasks").select("*").eq("user_id",uid),
      sb.from("prefs").select("*").eq("user_id",uid)
    ]);
    for(const r of[rt,rp]){
      const k=errKind(r);
      if(k==="net"){netFail();return}
      if(k==="auth"){if(await tryRefresh())syncAgain=true;return}
      if(k){console.warn("Lecture refusée :",r.error);return}
    }

    lastSync=now();localStorage.setItem(K_LAST,String(lastSync));
  }catch(e){if(isNetErr(e))netFail();else console.warn("Synchro :",e)}

}

/* Décision tâche par tâche, en comparant la copie locale (L), la base (B) et la version en ligne (S) */
async function syncTasks(server,prow,cf){
  if(!base){
    const legacy=!!localStorage.getItem("df-uid");               /* appareil de l'ancienne version : ses tâches sont déjà en ligne sous l'ancien identifiant, jamais renvoyées */
    if(server.size===0&&!prow&&tasks.length&&!legacy){base={}}  /* tout premier appareil d'un compte vide : ses tâches seront envoyées */
    else{                                                          /* sinon, au premier passage, la version en ligne fait foi */
      tasks=[...server.values()].map(toLocal).sort(byPos);
      base={};for(const r of server.values())base[r.id]=toBase(r);
      inflight={};saveLocal();saveSync();needRender=true;
      return true;
    }
  }
  const lmap=new Map(tasks.map(t=>[t.id,t]));
  const ops=[];let changed=false;
  const ids=new Set([...lmap.keys(),...Object.keys(base),...server.keys()]);
  for(const id of ids){
    if(id===editId)continue;                        /* tâche en cours d'édition : traitée à la fin de l'édition */
    const L=lmap.get(id),S=server.get(id);let B=base[id];
    const I=inflight[id];
    if(I){                                          /* reconnaître son propre envoi dont la réponse s'est perdue */
      if(I.op==="del"){if(!S){delete base[id];B=undefined}}
      else if(S&&Number(S.updated_at)===I.v){base[id]=toBase(S);B=base[id]}
      else if(S&&I.op==="ins"&&I.c){base[id]={v:I.v,...I.c};B=base[id]}   /* création arrivée puis modifiée ailleurs */
      delete inflight[id];
    }
    const lc=L?(!B||diffF(L,B).length>0):!!B;
    const sc=S?(!B||Number(S.updated_at)!==B.v):!!B;
    if(!lc&&!sc)continue;
    if(lc&&!sc){
      if(L&&!B)ops.push({k:"ins",id});
      else if(L)ops.push({k:"upd",id});
      else ops.push({k:"del",id});
      continue;
    }
    if(!lc&&sc){
      if(S){setLocal(toLocal(S));base[id]=toBase(S)}
      else{removeLocal(id);delete base[id]}
      changed=true;continue;
    }
    /* modifiée des deux côtés */
    if(!L&&!S){delete base[id];continue}
    if(L&&!B&&S){base[id]=toBase(S);if(diffF(L,S).length)ops.push({k:"upd",id});continue}
    if(L&&B&&S){
      const Ln=nt(L),Sn=nt(S),M={...Ln},clash=[];
      for(const f of FIELDS){
        const lf=Ln[f]!==B[f],sf=Sn[f]!==B[f];
        if(sf&&!lf)M[f]=Sn[f];
        else if(lf&&sf&&Ln[f]!==Sn[f]){if(SILENT.includes(f))M[f]=Sn[f];else clash.push(f)}
      }
      if(clash.length){cf.push({k:"fields",id,fields:clash,L:Ln,Lt:Number(L.updated_at)||0,S,M});continue}
      setLocal({...L,...M});base[id]=toBase(S);changed=true;
      if(diffF(M,Sn).length)ops.push({k:"upd",id});
      continue;
    }
    if(L&&B&&!S){                                   /* supprimée ailleurs, modifiée ici */
      if(diffF(L,B).every(f=>SILENT.includes(f))){removeLocal(id);delete base[id];changed=true}
      else cf.push({k:"delRemote",id,L:nt(L)});
      continue;
    }
    if(!L&&B&&S){                                   /* supprimée ici, modifiée ailleurs */
      if(diffF(S,B).every(f=>SILENT.includes(f))){base[id]=toBase(S);ops.push({k:"del",id})}
      else cf.push({k:"delLocal",id,S});
      continue;
    }
  }
  if(changed){tasks.sort(byPos);saveLocal();needRender=true}
  saveSync();
  for(const op of ops){
    const r=await runOp(op);
    if(r==="net"||r==="auth")return false;
    if(r==="retry")syncAgain=true;
  }
  return true;
}

/* Envoi conditionnel : il n'aboutit que si la version en ligne est toujours celle de la base */
async function runOp(op){
  const id=op.id,L=tasks.find(t=>t.id===id),B=base[id];
  let res;
  if(op.k==="ins"){
    if(!L)return"ok";
    const v=now();
    inflight[id]={op:"ins",v,c:nt(L)};saveSync();
    res=await sb.from("tasks").insert({id,user_id:uid,...nt(L),created_at:Number(L.created_at)||now(),updated_at:v}).select();
  }else if(op.k==="upd"){
    if(!L||!B)return"retry";
    const v=Math.max(now(),B.v+1),Ln=nt(L),patch={updated_at:v};
    for(const f of diffF(L,B))patch[f]=Ln[f];
    inflight[id]={op:"upd",v,c:Ln};saveSync();
    res=await sb.from("tasks").update(patch).eq("id",id).eq("updated_at",B.v).select();
  }else{
    if(!B)return"ok";
    inflight[id]={op:"del",v:B.v};saveSync();
    res=await sb.from("tasks").delete().eq("id",id).eq("updated_at",B.v).select();
  }
  const k=errKind(res);
  if(k==="net"){netFail();return"net"}                  /* l'envoi reste mémorisé : s'il est arrivé, la synchro suivante le reconnaîtra */
  delete inflight[id];
  if(k==="auth"){saveSync();return(await tryRefresh())?"retry":"auth"}
  if(k==="conflict"&&op.k==="ins"&&L){                  /* identifiant déjà pris par une ligne invisible : on en change */
    const nid=mkId();if(openId===id)openId=nid;L.id=nid;saveLocal();saveSync();return"retry";
  }
  if(k){saveSync();console.warn("Envoi refusé :",res.error);return"other"}      /* pas de relance en boucle : le prochain déclencheur réessaiera */
  const rows=res.data||[];
  if(op.k==="del"){if(!rows.length){saveSync();return"retry"}delete base[id]}
  else{if(!rows.length){saveSync();return"retry"}base[id]=toBase(rows[0])}
  saveSync();return"ok";
}

/* Préférences : même logique sur l'unique ligne prefs, champ par champ (catégories, ambiance) */
function adoptPrefs(prow){
  let c=[];try{c=JSON.parse(catsStr(prow.cats))}catch(e){}
  if(c.length){CATS=c;saveCatsLocal()}
  if(prow.theme&&AMBS.includes(prow.theme)&&prow.theme!==amb){amb=prow.theme;applyAmb()}
  if(!CATS.find(x=>x.id===tab)&&tab!=="trash")tab=CATS[0].id;
  pbase={v:Number(prow.updated_at),cats:catsStr(prow.cats),theme:prow.theme??null};
  needRender=true;
}
async function syncPrefs(prow,cf){
  const I=inflight.__prefs;
  if(I){if(prow&&Number(prow.updated_at)===I.v)pbase={v:I.v,cats:catsStr(prow.cats),theme:prow.theme??null};delete inflight.__prefs}
  if(!pbase){if(prow){adoptPrefs(prow);saveSync();return true}pbase={v:null,cats:"",theme:null}}
  const P=prefsLocal();
  const lc=P.cats!==pbase.cats||P.theme!==pbase.theme;
  const sc=prow?Number(prow.updated_at)!==pbase.v:pbase.v!==null;
  if(!lc&&!sc)return true;
  if(!lc&&sc){if(prow)adoptPrefs(prow);else pbase={v:null,cats:"",theme:null};saveSync();return true}
  let send=P;
  if(lc&&sc&&prow){
    const Sp={cats:catsStr(prow.cats),theme:prow.theme??null};
    const cl=P.cats!==pbase.cats&&Sp.cats!==pbase.cats&&P.cats!==Sp.cats;
    if(cl){cf.push({k:"cats",id:"__prefs",L:P.cats,S:prow});return true}
    const M={cats:P.cats!==pbase.cats?P.cats:Sp.cats,theme:(Sp.theme!==pbase.theme)?Sp.theme:P.theme};
    if(M.cats!==P.cats){CATS=JSON.parse(M.cats);saveCatsLocal();if(!CATS.find(x=>x.id===tab)&&tab!=="trash")tab=CATS[0].id}
    if(M.theme&&AMBS.includes(M.theme)&&M.theme!==amb){amb=M.theme;applyAmb()}
    pbase={v:Number(prow.updated_at),...Sp};needRender=true;send=prefsLocal();
    if(send.cats===pbase.cats&&send.theme===pbase.theme){saveSync();return true}
  }else if(lc&&sc&&!prow){pbase={v:null,cats:"",theme:null}}
  const v=Math.max(now(),(pbase.v||0)+1);
  inflight.__prefs={op:pbase.v===null?"ins":"upd",v};saveSync();
  let res;
  if(pbase.v===null)res=await sb.from("prefs").insert({user_id:uid,cats:send.cats,theme:send.theme,updated_at:v}).select();
  else{
    const patch={updated_at:v};if(send.cats!==pbase.cats)patch.cats=send.cats;if(send.theme!==pbase.theme)patch.theme=send.theme;
    res=await sb.from("prefs").update(patch).eq("user_id",uid).eq("updated_at",pbase.v).select();
  }
  const k=errKind(res);
  if(k==="net"){netFail();return false}
  delete inflight.__prefs;
  if(k==="auth"){saveSync();if(await tryRefresh())syncAgain=true;return false}
  if(k||!(res.data||[]).length){saveSync();syncAgain=true;return true}
  const r=res.data[0];pbase={v:Number(r.updated_at),cats:catsStr(r.cats),theme:r.theme??null};saveSync();
  return true;
}

/* ============================================================
   TEMPS RÉEL : un simple signal qui déclenche une relecture
   ============================================================ */
function unsubscribeRT(){for(const c of channels){try{sb.removeChannel(c)}catch(e){}}channels=[]}
function subscribeRT(){
  unsubscribeRT();
  const onSt=st=>{if(st==="SUBSCRIBED")scheduleSync(300)};
  const t=sb.channel("df-tasks-"+uid)
    .on("postgres_changes",{event:"*",schema:"public",table:"tasks",filter:`user_id=eq.${uid}`},onRT)
    .on("postgres_changes",{event:"DELETE",schema:"public",table:"tasks"},onRT)
    .subscribe(onSt);
  const p=sb.channel("df-prefs-"+uid)
    .on("postgres_changes",{event:"*",schema:"public",table:"prefs",filter:`user_id=eq.${uid}`},onRTP)
    .subscribe(onSt);
  channels=[t,p];
}
function onRT(p){
  if(!base)return;
  if(p.eventType==="DELETE"){const id=p.old&&p.old.id;if(id&&base[id])scheduleSync(800);return}
  const r=p.new;if(!r)return;
  const v=Number(r.updated_at),b=base[r.id],I=inflight[r.id];
  if((b&&b.v===v)||(I&&I.v===v))return;           /* écho de son propre envoi */
  scheduleSync(800);
}
function onRTP(p){
  const v=Number(p.new&&p.new.updated_at);
  if(pbase&&pbase.v===v)return;
  const I=inflight.__prefs;if(I&&I.v===v)return;
  scheduleSync(800);
}

/* ============================================================
   MISE EN ARRIÈRE-PLAN : envoi immédiat, sans relecture préalable
   ============================================================ */
function flushOnHide(){
  clearTimeout(syncTimer);syncTimer=null;
  if(runP||authState!=="ok"||!uid||!token||!base)return;
  const H={apikey:SB_KEY,Authorization:"Bearer "+token,"Content-Type":"application/json",Prefer:"return=minimal"};
  const lmap=new Map(tasks.map(t=>[t.id,t]));
  const send=(url,method,body)=>{try{fetch(url,{method,headers:H,body:body?JSON.stringify(body):undefined,keepalive:true}).catch(()=>{})}catch(e){}};
  let n=0;
  for(const id of localChanges()){
    if(n>=20)break;if(id===editId)continue;
    const L=lmap.get(id),B=base[id],q=`${SB_URL}/rest/v1/tasks?id=eq.${encodeURIComponent(id)}`;
    if(L&&!B){const v=now();inflight[id]={op:"ins",v,c:nt(L)};send(`${SB_URL}/rest/v1/tasks`,"POST",{id,user_id:uid,...nt(L),created_at:Number(L.created_at)||now(),updated_at:v})}
    else if(L){const v=Math.max(now(),B.v+1),Ln=nt(L),patch={updated_at:v};for(const f of diffF(L,B))patch[f]=Ln[f];inflight[id]={op:"upd",v,c:Ln};send(`${q}&updated_at=eq.${B.v}`,"PATCH",patch)}
    else{inflight[id]={op:"del",v:B.v};send(`${q}&updated_at=eq.${B.v}`,"DELETE")}
    n++;
  }
  if(pbase&&prefsChanged()){
    const P=prefsLocal(),v=Math.max(now(),(pbase.v||0)+1);
    inflight.__prefs={op:pbase.v===null?"ins":"upd",v};
    if(pbase.v===null)send(`${SB_URL}/rest/v1/prefs`,"POST",{user_id:uid,cats:P.cats,theme:P.theme,updated_at:v});
    else{const patch={updated_at:v};if(P.cats!==pbase.cats)patch.cats=P.cats;if(P.theme!==pbase.theme)patch.theme=P.theme;send(`${SB_URL}/rest/v1/prefs?user_id=eq.${encodeURIComponent(uid)}&updated_at=eq.${pbase.v}`,"PATCH",patch)}
  }
  saveSync();
}

   CONNEXION
   ============================================================ */
function setAuthRequired(){if(authState==="required")return;authState="required";unsubscribeRT();updDot()}
function startSession(s){
  if(!s||!s.user)return;
  const id=s.user.id,owner=localStorage.getItem(K_OWNER);
  token=s.access_token;
  if(owner&&owner!==id)resetLocalData();                 /* autre compte : on repart de zéro sur cet appareil */
  uid=id;localStorage.setItem(K_OWNER,id);if(s.user.email)localStorage.setItem(K_EMAIL,s.user.email);
  const was=authState;authState="ok";hideLogin();
  if(!channels.length)subscribeRT();
  updDot();
  if(was!=="ok"||!lastSync)syncNow("session");
}
function resetLocalData(){
  tasks=[];base=null;pbase=null;inflight={};conflicts=[];lastSync=null;
  CATS=[...DEFAULT_CATS];tab=CATS[0].id;
  saveLocal();saveSync();saveCatsLocal();localStorage.removeItem(K_LAST);
  needRender=true;
}
async function recoverAuth(){
  if(!sb||authState==="none"||loginShown&&authState!=="required")return;
  try{
    const{data,error}=await sb.auth.getSession();
    if(data&&data.session)return startSession(data.session);
    if(error&&isNetErr(error)){netFail();return}
    if(localStorage.getItem(K_OWNER))setAuthRequired();
  }catch(e){if(isNetErr(e))netFail()}
}
async function initAuth(){
  sb=createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:SK+"-auth"}});
  sb.auth.onAuthStateChange((ev,session)=>{
    token=session?session.access_token:token;
    if(ev==="SIGNED_OUT"){token=null;if(!manualLogout&&uid)setAuthRequired();return}
    if(session&&authState!=="ok"&&!manualLogout&&uid&&session.user.id===uid)setTimeout(()=>startSession(session),0);
  });
  let session=null,err=null;
  try{const r=await sb.auth.getSession();session=r.data&&r.data.session;err=r.error}catch(e){err=e}
  if(session)return startSession(session);
  const owner=localStorage.getItem(K_OWNER);
  if(!owner){authState="none";showLogin("first");return}
  uid=owner;                                              /* appareil déjà relié : l'app reste utilisable avec la copie locale */
  if(err&&isNetErr(err)){authState="unknown";netFail()}
  else setAuthRequired();
}
async function doLogin(email,pw,mode){
  const btn=$("#lgGo");if(btn){btn.disabled=true;btn.textContent="Connexion…"}
  loginMsg("");
  try{
    const{data,error}=await sb.auth.signInWithPassword({email,password:pw});
    if(error){loginMsg(isNetErr(error)?"Pas de réseau pour l'instant. Réessaie dans un moment.":(error.status===400||/invalid/i.test(error.message||"")?"Adresse ou mot de passe incorrect.":"Connexion refusée : "+(error.message||"erreur inconnue")));return}
    startSession(data.session);
  }catch(e){loginMsg("Pas de réseau pour l'instant. Réessaie dans un moment.")}
  finally{const b=$("#lgGo");if(b){b.disabled=false;b.textContent=mode==="again"?"Se reconnecter":"Se connecter"}}
}
function loginMsg(m){const el=$("#lgErr");if(!el)return;el.innerHTML=m?`<div class="sy-card"><span class="sy-dot alert"></span><div><div class="sy-t">${esc(m)}</div></div></div>`:""}

  }else h+=`<h1>Connexion<small>Une seule fois sur cet appareil. La session reste ensuite ouverte.</small></h1>`;

function hideLogin(){if(!loginShown)return;loginShown=false;const el=$("#login");el.classList.add("hid");el.innerHTML="";refreshUI()}
async function doLogout(){

/* ============================================================
   ÉTAT AFFICHÉ : pastille sur le bouton menu et bloc Synchronisation
   vert : tout est en ligne ; ambre : pas encore en ligne ; rouge : l'app a besoin de toi ; gris : vérification en cours
   ============================================================ */
function status(){
  const n=pendingCount(),mods=`${n} ${pl(n,"modification","modifications")} en attente`;
  if(authState==="required")return{c:"alert",t:"Connexion requise",s:n?`${n>1?`Tes ${n} modifications en attente sont gardées`:"Ta modification en attente est gardée"} sur cet appareil et ${pl(n,"partira","partiront")} après la reconnexion.`:"Reconnecte-toi pour reprendre la synchronisation.",b:"relogin"};
  if(conflicts.length)return{c:"alert",t:conflicts.length>1?`${conflicts.length} conflits à trancher`:"Un conflit à trancher",s:"Choisis la version à garder pour reprendre la synchronisation.",b:"conflicts"};
  if(netState==="offline")return{c:"wait",t:n?mods:"Hors connexion",s:(offlineSince?`Hors connexion depuis ${hm(offlineSince).replace(/^à /,"")}. `:"")+(n?`${pl(n,"Elle est gardée","Elles sont gardées")} sur cet appareil et ${pl(n,"partira","partiront")} d'${pl(n,"elle","elles")}-même${pl(n,"","s")} au retour du réseau.`:(lastSync?`Dernière synchronisation ${hm(lastSync)}.`:"")),b:"retry"};
  if(authState!=="ok")return{c:"",t:"Vérification en cours…",s:"",b:null};
  if(n)return{c:"wait",t:mods,s:syncing?"Envoi en cours…":"Envoi dans un instant.",b:syncing?null:"sync"};
  if(syncing&&!lastSync)return{c:"",t:"Vérification en cours…",s:"",b:null};
  return{c:"ok",t:"Tout est enregistré en ligne",s:lastSync?`Dernière synchronisation ${hm(lastSync)}`:"",b:syncing?null:"sync"};
}
const ICON_SYNC=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>`;

  const d=$("#syncd"),s=status();

function maybeShowConflict(){

  if(cfOpen){renderConflict();return}
  if(editId||isDragging||sheetId||loginShown||!$("#modalOv").classList.contains("hid"))return;

function catName(id){const c=CATS.find(x=>x.id===id);return c?c.label:id}
function descr(vals,fields){
  let h="";

    if(f==="color")h+=`<span class="cf-m cf-c">Couleur <i style="background:${vals.color==="#FFFFFF"?"var(--field)":escA(vals.color)}"></i>${vals.color==="#FFFFFF"?" aucune":""}</span>`;

}
const CK=`<span class="cf-ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>`;
function renderConflict(){
  const c=conflicts[0];if(!c){cfOpen=false;closeModal();return}
  const key=c.k+":"+c.id;if(cfShown!==key){cfPick=null;cfShown=key}
  const ov=$("#modalOv");ov.classList.remove("hid");
  const n=conflicts.length;
  let h=`<div class="modal-box" role="dialog" aria-modal="true">`;
  if(n>1)h+=`<div class="cf-n">Conflit 1 sur ${n}</div>`;
  if(c.k==="fields"){
    const Sn=nt(c.S),others=FIELDS.some(f=>!c.fields.includes(f)&&!SILENT.includes(f)&&c.L[f]!==Sn[f]);
    const what=c.fields.length===1&&c.fields[0]==="text"?"Le texte de cette tâche a changé":`Cette tâche a changé (${c.fields.map(f=>FIELD_LBL[f]).join(", ")})`;
    h+=`<div class="modal-title">Modifiée sur tes deux appareils</div><div class="cf-p">${what} ici et sur ton autre appareil. Choisis la version à garder.${others?" Ses autres changements ont déjà été réunis.":""}</div>`;
    h+=`<button class="cf-opt${cfPick==="here"?" sel":""}" data-cfp="here"><span class="cf-k">Sur cet appareil</span>${descr(c.L,c.fields)}${c.Lt?`<span class="cf-m">Modifié ${hm(c.Lt)}</span>`:""}${CK}</button>`;
    h+=`<button class="cf-opt${cfPick==="there"?" sel":""}" data-cfp="there"><span class="cf-k">Sur l'autre appareil</span>${descr(Sn,c.fields)}<span class="cf-m">Modifié ${hm(Number(c.S.updated_at))}</span>${CK}</button>`;
    h+=`<button class="cf-go" id="cfGo" ${cfPick?"":"disabled"}>Garder cette version</button>`;
  }else if(c.k==="cats"){
    const lab=s=>{try{return JSON.parse(catsStr(s)).map(x=>esc(x.label)).join(" · ")}catch(e){return""}};
    h+=`<div class="modal-title">Catégories modifiées sur tes deux appareils</div><div class="cf-p">La liste des catégories a changé ici et sur ton autre appareil. Choisis la version à garder.</div>`;
    h+=`<button class="cf-opt${cfPick==="here"?" sel":""}" data-cfp="here"><span class="cf-k">Sur cet appareil</span><span class="cf-v">${lab(c.L)}</span>${CK}</button>`;
    h+=`<button class="cf-opt${cfPick==="there"?" sel":""}" data-cfp="there"><span class="cf-k">Sur l'autre appareil</span><span class="cf-v">${lab(c.S.cats)}</span>${CK}</button>`;
    h+=`<button class="cf-go" id="cfGo" ${cfPick?"":"disabled"}>Garder cette version</button>`;
  }else if(c.k==="delRemote"){
    h+=`<div class="modal-title">Supprimée sur ton autre appareil</div><div class="cf-p">Tu as modifié cette tâche ici pendant qu'elle était supprimée définitivement ailleurs.</div>`;
    h+=`<div class="cf-opt cf-static"><span class="cf-k">Ta version</span>${descr(c.L,["text"])}</div>`;
    h+=`<div class="modal-actions"><button class="btn-cancel" data-cfa="drop">Accepter la suppression</button><button class="btn-primary" data-cfa="keep">Garder ma version</button></div>`;
  }else{
    h+=`<div class="modal-title">Modifiée sur ton autre appareil</div><div class="cf-p">Tu as supprimé définitivement cette tâche ici pendant qu'elle était modifiée ailleurs.</div>`;
    h+=`<div class="cf-opt cf-static"><span class="cf-k">Sur l'autre appareil</span>${descr(nt(c.S),["text"])}</div>`;
    h+=`<div class="modal-actions"><button class="btn-cancel" data-cfa="drop">Confirmer la suppression</button><button class="btn-primary" data-cfa="keep">Garder cette version</button></div>`;
  }
  h+=`</div>`;
  ov.innerHTML=h;
  ov.querySelectorAll("[data-cfp]").forEach(b=>{b.onclick=()=>{cfPick=b.dataset.cfp;renderConflict()}});
  const go=$("#cfGo");if(go)go.onclick=()=>{if(cfPick)resolveConflict(c,cfPick)};
  ov.querySelectorAll("[data-cfa]").forEach(b=>{b.onclick=()=>resolveConflict(c,b.dataset.cfa)});
}
function resolveConflict(c,choice){
  if(c.k==="fields"){
    const Sn=nt(c.S),src=choice==="here"?c.L:Sn,M={...c.M};
    for(const f of c.fields)M[f]=src[f];
    const L=tasks.find(t=>t.id===c.id);
    if(L)Object.assign(L,M,{updated_at:now()});else tasks.push({id:c.id,...M,created_at:Number(c.S.created_at)||now(),updated_at:now()});
    base[c.id]=toBase(c.S);
  }else if(c.k==="cats"){
    const src=choice==="here"?c.L:catsStr(c.S.cats);
    CATS=JSON.parse(src);if(!CATS.length)CATS=[...DEFAULT_CATS];saveCatsLocal();
    if(!CATS.find(x=>x.id===tab)&&tab!=="trash")tab=CATS[0].id;
    pbase={v:Number(c.S.updated_at),cats:catsStr(c.S.cats),theme:pbase?pbase.theme:null};
  }else if(c.k==="delRemote"){
    if(choice==="drop")removeLocal(c.id);
    delete base[c.id];                                   /* garder : elle sera recréée en ligne */
  }else{
    if(choice==="keep")setLocal(toLocal(c.S));
    base[c.id]=toBase(c.S);                              /* confirmer : suppression envoyée contre la version vue */
  }
  conflicts=conflicts.filter(x=>x!==c);cfEpoch++;
  saveLocal();saveSync();
  cfOpen=false;cfPick=null;cfShown="";
  $("#modalOv").classList.add("hid");
  tasks.sort(byPos);renderTabs();render();
  if(conflicts.length)maybeShowConflict();
  syncNow("conflit");
}

function getList(){

function addTask(txt){
  const cat=tab==="trash"?CATS[0].id:tab;

  const mx=fl.length>0?Math.max(...fl.map(t=>t.position||0)):0;
  const t={id:mkId(),text:txt,category:cat,completed:false,deleted:false,position:mx+1,color:"#FFFFFF",created_at:now(),updated_at:now(),deleted_at:null};
  tasks.push(t);touch();
  justAdded=t.id;render();
  setTimeout(()=>{justAdded=null},600);
}
function updTask(id,fields){
  const t=tasks.find(t=>t.id===id);if(!t)return;

function toggleTask(id){
  const t=tasks.find(t=>t.id===id);if(!t)return;

function restoreTask(id){if(openId===id)openId=null;updTask(id,{deleted:false,deleted_at:null})}
function permDelete(id){
  if(openId===id)openId=null;

}
function emptyTrash(){
  tasks=tasks.filter(t=>!t.deleted);

}

  $("#dayTitle").childNodes[0].textContent=dateFR();
  const sub=$("#daySub"),prog=$("#progress"),fill=$("#pfill");
  if(tab==="trash"){
    const n=tasks.filter(t=>t.deleted).length;
    sub.textContent=n?`${n} élément${n>1?"s":""} dans la corbeille`:"Corbeille vide";
    prog.classList.add("hid");
    return;
  }
  prog.classList.remove("hid");
  const all=tasks.filter(t=>!t.deleted&&t.category===tab);
  const done=all.filter(t=>t.completed).length;
  const rem=all.length-done;
  sub.textContent=all.length?`${rem} restante${rem>1?"s":""} · ${done} terminée${done>1?"s":""}`:"Aucune tâche pour l'instant";
  fill.style.width=(all.length?Math.round(done/all.length*100):0)+"%";
  fill.style.background=cat?cat.color:"var(--ink)";
}

function render(){
  const fl=getList();
  const active=fl.filter(t=>!t.completed);
  const done=fl.filter(t=>t.completed);
  const cat=CATS.find(c=>c.id===tab);
  const isTrash=tab==="trash";

  renderHeader();

  const composer=$("#composer");
  if(isTrash)composer.classList.add("hid");else composer.classList.remove("hid");
  if(cat)$("#inp").placeholder=`Nouvelle tâche ${cat.label}…`;

  const tl=$("#tl"),em=$("#empt");
  if(!fl.length){
    tl.innerHTML="";em.classList.remove("hid");
    em.innerHTML=isTrash?`<p>Corbeille vide</p>`:`<p>Tout est fait !</p>`;
    firstRender=false;
    return;
  }
  em.classList.add("hid");

  let idx=0;
  const row=(t,faded)=>{
    const bgColor=t.color||"#FFFFFF";
    const colored=bgColor!=="#FFFFFF";
    const cls=["row",colored?"colored":"",faded?"faded":"",openId===t.id?"open":"",justAdded===t.id?"rise":"",firstRender?"rise":""].filter(Boolean).join(" ");
    const delay=firstRender?`animation-delay:${.05*idx}s;`:"";
    idx++;

    let ck="";
    if(!isTrash){
      if(t.completed)ck=`<button class="chk done ${justDone===t.id?"pop":""}" data-ck="${t.id}">${ic("i-chk")}</button>`;
      else ck=`<button class="chk" data-ck="${t.id}"></button>`;
    }

    let content;
    if(editId===t.id){
      content=`<div class="tcon"><textarea class="tedit" data-ei="${t.id}">${esc(t.text)}</textarea></div>`;
    }else{
      const{title,details}=splitText(t.text);
      const det=details?`<div class="tdetails">${esc(details)}</div>`:"";
      content=`<div class="tcon"><div class="ttitle">${esc(title)}</div>${det}</div>`;
    }

    let acts;
    if(isTrash){
      acts=`<button class="rest" data-rest="${t.id}" title="Restaurer">${ic("i-undo")}</button><button class="del" data-pdel="${t.id}" title="Supprimer définitivement">${ic("i-x")}</button>`;
    }else{
      acts=`<button class="grip" data-dg="${t.id}" title="Réordonner">${ic("i-grip")}</button><button data-edit="${t.id}" title="Modifier">${ic("i-pen")}</button><button data-col="${t.id}" title="Couleur / Déplacer">${ic("i-pal")}</button><button data-cal="${t.id}" title="Google Agenda">${ic("i-cal")}</button><button class="del" data-del="${t.id}" title="Corbeille">${ic("i-trash")}</button>`;
    }

    return`<div class="${cls}" data-tid="${t.id}" style="${delay}${colored?`background:${bgColor}`:""}"><div class="row-head">${ck}${content}</div><div class="acts">${acts}</div></div>`;
  };

  let html="";
  if(isTrash&&fl.length){
    html+=`<button class="empty-trash" data-emptytrash>${ic("i-trash")} Vider la corbeille</button>`;
  }
  active.forEach(t=>{html+=row(t,false)});
  if(done.length&&!isTrash){
    html+=`<div class="done-lbl${firstRender?" rise":""}">Terminées</div>`;
    done.forEach(t=>{html+=row(t,justDone!==t.id)});
  }else{
    done.forEach(t=>{html+=row(t,justDone!==t.id)});
  }
  tl.innerHTML=html;
  firstRender=false;
  bindRows();
}

// ============================================================
// BIND
// ============================================================
function bindRows(){
  // Vider la corbeille
  const et=$("[data-emptytrash]");
  if(et){et.onclick=()=>{
    const n=tasks.filter(t=>t.deleted).length;
    if(confirm(`Vider la corbeille ? Les ${n} élément${n>1?"s":""} seront supprimés définitivement.`))emptyTrash();
  }}

  // Tap rangée = toggle actions (un seul ouvert)
  $$(".row").forEach(r=>{
    r.addEventListener("click",e=>{
      if(e.target.closest(".chk,.acts,.tedit"))return;
      if(editId)return;
      const tid=r.dataset.tid;
      openId=openId===tid?null:tid;
      render();
    });
  });

  $$("[data-ck]").forEach(b=>{b.onclick=e=>{e.stopPropagation();toggleTask(b.dataset.ck)}});

  // Édition via crayon
  $$("[data-edit]").forEach(b=>{b.onclick=e=>{
    e.stopPropagation();
    editId=b.dataset.edit;render();
    const ta=$(`[data-ei="${editId}"]`);
    if(ta){autoGrow(ta);ta.focus();ta.selectionStart=ta.value.length}
  }});
  $$("[data-ei]").forEach(ta=>{
    const id=ta.dataset.ei;
    ta.oninput=()=>autoGrow(ta);
    ta.onblur=()=>{
      const v=ta.value.trim();
      editId=null;
      if(v)updTask(id,{text:v});else{render();scheduleSync(300)}
    };
    ta.onkeydown=e=>{
      if(e.key==="Escape"){editId=null;render();scheduleSync(300)}
      if(e.key==="Enter"&&(e.ctrlKey||e.metaKey))ta.blur();
    };
  });

  // Couleur
  $$("[data-col]").forEach(b=>{b.onclick=e=>{e.stopPropagation();openSheet(b.dataset.col)}});
  // Google Agenda direct
  $$("[data-cal]").forEach(b=>{b.onclick=e=>{
    e.stopPropagation();
    const t=tasks.find(t=>t.id===b.dataset.cal);if(!t)return;
    const{title,details}=splitText(t.text);
    let url=`https://www.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}`;
    if(details)url+=`&details=${encodeURIComponent(details)}`;
    window.open(url,"_blank");
  }});
  // Corbeille / restaurer / suppression définitive
  $$("[data-del]").forEach(b=>{b.onclick=e=>{e.stopPropagation();softDelete(b.dataset.del)}});
  $$("[data-rest]").forEach(b=>{b.onclick=e=>{e.stopPropagation();restoreTask(b.dataset.rest)}});
  $$("[data-pdel]").forEach(b=>{b.onclick=e=>{
    e.stopPropagation();
    if(confirm("Supprimer définitivement cette tâche ?"))permDelete(b.dataset.pdel);
  }});
  // Drag
  $$("[data-dg]").forEach(h=>{h.onpointerdown=e=>{
    e.preventDefault();e.stopPropagation();
    const r=h.closest(".row");if(!r)return;
    dragId=r.dataset.tid;isDragging=true;
    r.classList.add("drg");
  }});
}

// ============================================================
// BOTTOM SHEET couleurs
// ============================================================
function openSheet(id){
  sheetId=id;renderSheet();
  $("#shov").classList.remove("hid");
  $("#shee").classList.remove("hid");
}
function closeSheet(){
  sheetId=null;
  $("#shov").classList.add("hid");
  $("#shee").classList.add("hid");
  render();
}
function renderSheet(){
  const t=tasks.find(t=>t.id===sheetId);if(!t)return;
  const bd=$("#shbd");
  const{title}=splitText(t.text);
  const cur=t.color||"#FFFFFF";
  const dot=(c,sel)=>`<button class="cdot" style="background:${c==="#FFFFFF"?"var(--field)":c};border-color:${sel?"var(--ink)":"var(--hair)"}" data-sc="${c}">${sel?`<svg style="color:${c==="#FFFFFF"?"var(--ink2)":"#fff"}"><use href="#i-chk"/></svg>`:""}</button>`;
  let h=`<div class="sht">${esc(title)}</div>`;
  h+=`<div class="clbl">Couleurs pleines</div><div class="cgrd">${dot("#FFFFFF",cur==="#FFFFFF")}${SOLIDS.map(c=>dot(c,cur===c)).join("")}</div>`;
  h+=`<div class="clbl">Pastel</div><div class="cgrd">${PASTELS.map(c=>dot(c,cur===c)).join("")}</div>`;
  const others=CATS.filter(c=>c.id!==t.category);
  if(others.length){
    h+=`<div class="clbl">Déplacer vers</div><div class="move-grid">${others.map(c=>`<button class="move-pill" data-mv="${c.id}"><i style="background:${c.color}"></i>${esc(c.label)}</button>`).join("")}</div>`;
  }
  h+=`<button class="scl" data-sa="close">Fermer</button>`;
  bd.innerHTML=h;
  bd.querySelectorAll("[data-sc]").forEach(d=>{d.onclick=()=>{updTask(sheetId,{color:d.dataset.sc});renderSheet()}});
  bd.querySelectorAll("[data-mv]").forEach(b=>{b.onclick=()=>{
    const target=b.dataset.mv;
    const fl2=tasks.filter(x=>!x.deleted&&x.category===target);
    const mx=fl2.length?Math.max(...fl2.map(x=>x.position||0)):0;
    openId=null;
    updTask(sheetId,{category:target,position:mx+1});
    closeSheet();
  }});
  bd.querySelector("[data-sa=close]").onclick=closeSheet;
}

// ============================================================
// TABS
// ============================================================
function renderTabs(){
  const bar=$("#tabs");bar.innerHTML="";
  CATS.forEach(c=>{
    const b=document.createElement("button");
    b.className="tab"+(tab===c.id?" on":"");
    b.style.setProperty("--tabc",c.color);
    b.textContent=c.label;
    b.onclick=()=>{tab=c.id;editId=null;openId=null;renderTabs();render()};
    let lp;
    b.addEventListener("pointerdown",()=>{lp=setTimeout(()=>openCatEditor(c.id),500)});
    b.addEventListener("pointerup",()=>clearTimeout(lp));
    b.addEventListener("pointerleave",()=>clearTimeout(lp));
    bar.appendChild(b);
  });
  const addBtn=document.createElement("button");
  addBtn.className="tab-add";addBtn.textContent="+";
  addBtn.onclick=()=>openCatEditor(null);
  bar.appendChild(addBtn);
  const tb2=document.createElement("button");
  tb2.className="tab trash-tab"+(tab==="trash"?" on":"");
  tb2.style.setProperty("--tabc","var(--ink2)");
  tb2.textContent=TRASH_LABEL;
  tb2.onclick=()=>{tab="trash";editId=null;openId=null;renderTabs();render()};
  bar.appendChild(tb2);
}

// ============================================================
// CATEGORY EDITOR
// ============================================================
function closeModal(){$("#modalOv").classList.add("hid");menuOpen=false;setTimeout(maybeShowConflict,60)}
function openCatEditor(catId){
  const existing=catId?CATS.find(c=>c.id===catId):null;
  const idx=existing?CATS.indexOf(existing):-1;
  const ov=$("#modalOv");ov.classList.remove("hid");
  let selColor=existing?existing.color:CAT_COLORS[CATS.length%CAT_COLORS.length];
  let h=`<div class="modal-box"><button class="modal-close" id="ceClose">✕</button><div class="modal-title">${existing?"Modifier la catégorie":"Nouvelle catégorie"}</div><div class="cat-form">`;
  h+=`<input type="text" id="ceName" placeholder="Nom de la catégorie" value="${existing?esc(existing.label):""}">`;
  h+=`<div><div class="clbl" style="margin-top:0">Couleur</div><div class="cat-color-pick">`;
  CAT_COLORS.forEach(c=>{h+=`<button class="cat-color-dot${c===selColor?" sel":""}" data-cec="${c}" style="background:${c}"></button>`});
  h+=`</div></div>`;
  if(existing&&CATS.length>1){
    h+=`<div><div class="clbl" style="margin-top:0">Position</div><div class="move-row"><button id="ceLeft" ${idx===0?"disabled":""}>← Déplacer à gauche</button><button id="ceRight" ${idx===CATS.length-1?"disabled":""}>Déplacer à droite →</button></div></div>`;
  }
  h+=`</div><div class="modal-actions"><button class="btn-cancel" id="ceCnc">Annuler</button>`;
  if(existing&&CATS.length>1)h+=`<button class="btn-danger" id="ceDel">Supprimer</button>`;
  h+=`<button class="btn-primary" id="ceSave">${existing?"Enregistrer":"Créer"}</button></div></div>`;
  ov.innerHTML=h;
  ov.querySelector("#ceClose").onclick=closeModal;
  ov.querySelector("#ceCnc").onclick=closeModal;
  ov.querySelectorAll("[data-cec]").forEach(b=>{b.onclick=()=>{selColor=b.dataset.cec;ov.querySelectorAll(".cat-color-dot").forEach(x=>x.classList.toggle("sel",x.dataset.cec===selColor))}});
  const moveCat=dir=>{
    const i=CATS.indexOf(existing);const j=i+dir;
    if(j<0||j>=CATS.length)return;
    [CATS[i],CATS[j]]=[CATS[j],CATS[i]];
    saveCatsLocal();touch();renderTabs();
    openCatEditor(catId);
  };
  const lb=ov.querySelector("#ceLeft");if(lb)lb.onclick=()=>moveCat(-1);
  const rb=ov.querySelector("#ceRight");if(rb)rb.onclick=()=>moveCat(1);
  const db=ov.querySelector("#ceDel");
  if(db){db.onclick=()=>{
    if(!confirm(`Supprimer la catégorie "${existing.label}" ? Ses tâches iront dans "${CATS.find(c=>c!==existing).label}".`))return;
    const target=CATS.find(c=>c!==existing).id;
    tasks.filter(t=>t.category===catId).forEach(t=>{t.category=target;t.updated_at=now()});
    CATS=CATS.filter(c=>c.id!==catId);
    saveCatsLocal();touch();
    if(tab===catId)tab=CATS[0].id;
    closeModal();renderTabs();render();
  }}
  ov.querySelector("#ceSave").onclick=()=>{
    const name=ov.querySelector("#ceName").value.trim();if(!name)return;
    if(existing){existing.label=name;existing.color=selColor}
    else{const nc={id:mkId(),label:name,color:selColor};CATS.push(nc);tab=nc.id}
    saveCatsLocal();touch();closeModal();renderTabs();render();
  };
}

// ============================================================
// COMPOSER
// ============================================================
function initInput(){
  const inp=$("#inp"),btn=$("#abtn");
  inp.addEventListener("input",()=>{
    autoGrow(inp);
    const cat=CATS.find(c=>c.id===tab)||CATS[0];
    btn.disabled=!inp.value.trim();
    btn.style.background=inp.value.trim()?cat.color:"";
  });
  inp.addEventListener("keydown",e=>{
    if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();submitTask()}
  });
  btn.onclick=submitTask;
  function submitTask(){
    if(tab==="trash")return;
    const t=inp.value.trim();if(!t)return;
    addTask(t);
    inp.value="";inp.style.height="auto";
    btn.disabled=true;btn.style.background="";
  }
}

// ============================================================
// EXPORT / IMPORT + MENU
// ============================================================
function exportData(){
  const data={tasks,cats:CATS};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download="daily-flow-backup.json";
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
/* Import : les tâches du fichier sont ajoutées ou remplacent celles de même identifiant ; les autres sont conservées */
function importData(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!data.tasks||!Array.isArray(data.tasks)){alert("Fichier non reconnu.");return}
      for(const t of data.tasks){if(t&&t.id)setLocal({id:String(t.id),...nt(t),created_at:Number(t.created_at)||now(),updated_at:now()})}
      tasks.sort(byPos);
      if(data.cats&&Array.isArray(data.cats)&&data.cats.length){CATS=JSON.parse(catsStr(data.cats));if(!CATS.length)CATS=[...DEFAULT_CATS];saveCatsLocal();if(!CATS.find(c=>c.id===tab))tab=CATS[0].id}
      touch();renderTabs();render();
      alert("Import réussi !");
    }catch(e){alert("Erreur d'import : "+e.message)}
  };
  reader.readAsText(file);
}
function openMenu(){
  const ov=$("#modalOv");ov.classList.remove("hid");menuOpen=true;
  const em=localStorage.getItem(K_EMAIL)||"";
  let h=`<div class="modal-box"><button class="modal-close" id="menuClose" aria-label="Fermer">✕</button><div class="modal-title">Menu</div>`;
  h+=`<div class="sy-lbl">Synchronisation</div><div id="syncBlk"></div>`;
  h+=`<div class="sy-lbl">Compte</div><div class="sy-acc">${uid&&em?`Connecté avec ${esc(em)}`:"Non connecté"}</div>`;
  h+=`<button class="sbtn" id="menuLogout">Se déconnecter</button>`;
  h+=`<div class="sy-lbl">Données</div>`;
  h+=`<button class="sbtn" id="menuExport" style="margin-bottom:8px">📥 Exporter les données (JSON)</button>`;
  h+=`<button class="sbtn" id="menuImport">📤 Importer des données</button>`;
  h+=`</div>`;
  ov.innerHTML=h;
  renderSyncBlk();
  ov.querySelector("#menuClose").onclick=closeModal;
  ov.querySelector("#menuLogout").onclick=doLogout;
  ov.querySelector("#menuExport").onclick=()=>{exportData();closeModal()};
  ov.querySelector("#menuImport").onclick=()=>{closeModal();$("#importFile").click()};
}

// ============================================================
// INIT
// ============================================================
async function init(){
  tasks=loadLocal();
  loadCats();
  loadAmb();

  renderTabs();render();initInput();
  $("#shov").onclick=closeSheet;
  $("#menuBtn").onclick=()=>{if(!cfOpen)openMenu()};
  $("#ambDot").onclick=()=>$("#ambs").classList.toggle("open");
  $("#importFile").onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=""};

  /* Relances de la synchro : retour du réseau, retour au premier plan, page restaurée depuis le cache */
  window.addEventListener("online",()=>{if(authState==="ok")syncNow("reseau");else recoverAuth()});
  window.addEventListener("offline",()=>netFail());
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="hidden")flushOnHide();
    else if(authState==="ok")syncNow("premier-plan");
    else recoverAuth();
  });
  window.addEventListener("pagehide",flushOnHide);
  window.addEventListener("pageshow",e=>{if(e.persisted){if(authState==="ok")syncNow("cache");else recoverAuth()}});

  document.addEventListener("pointermove",ev=>{
    if(!dragId)return;ev.preventDefault();
    const tl=$("#tl");if(!tl)return;
    const dragRow=tl.querySelector(`[data-tid="${dragId}"]`);if(!dragRow)return;
    const rows=[...tl.querySelectorAll(".row")];
    for(const c of rows){
      if(c===dragRow)continue;
      const r=c.getBoundingClientRect();const mid=r.top+r.height/2;
      if(ev.clientY<mid&&c.compareDocumentPosition(dragRow)&Node.DOCUMENT_POSITION_FOLLOWING){tl.insertBefore(dragRow,c);break}
      else if(ev.clientY>mid&&c.compareDocumentPosition(dragRow)&Node.DOCUMENT_POSITION_PRECEDING){tl.insertBefore(dragRow,c.nextSibling);break}
    }
  });
  document.addEventListener("pointerup",()=>{
    if(!dragId)return;
    const tl=$("#tl");
    const dragRow=tl?tl.querySelector(`[data-tid="${dragId}"]`):null;
    if(dragRow)dragRow.classList.remove("drg");
    if(tl){
      const newOrder=[...tl.querySelectorAll(".row")].map(c=>c.dataset.tid);
      const taskMap=new Map(tasks.map(t=>[t.id,t]));
      newOrder.forEach((id,i)=>{const t=taskMap.get(id);if(t&&t.position!==i){t.position=i;t.updated_at=now()}});
      tasks.sort(byPos);
    }
    dragId=null;touch();                                   /* seules les tâches déplacées partiront */
    setTimeout(()=>{isDragging=false;refreshUI()},1500);
  });

  $("#LS").classList.add("h");
  $("#app").style.display="block";
  setTimeout(()=>{const ls=$("#LS");if(ls)ls.remove()},400);

  updDot();
  await initAuth();
}

if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);
else init();
</script>
